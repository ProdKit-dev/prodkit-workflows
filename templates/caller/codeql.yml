name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: runner
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-runner-policy.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'policy' }}
      fork_safe: true

  codeql:
    name: codeql
    needs: runner
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-codeql.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      runner_json: ${{ needs.runner.outputs.runner_json }}
      languages_json: '["python","javascript-typescript","actions"]'
      check_script: .prodkit/workflows/codeql-check.sh
