name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: runner
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-runner-policy.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'policy' }}
      fork_safe: true

  ci:
    name: ci
    needs: runner
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-ci-compact.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      runner_json: ${{ needs.runner.outputs.runner_json }}
      hygiene_enabled: true
      python_enabled: true
      python_versions_json: '["3.12","3.13","3.14"]'
      node_enabled: true
      node_versions_json: '["20","22","24"]'
      postgres_enabled: false
      container_enabled: false
      custom_enabled: false
