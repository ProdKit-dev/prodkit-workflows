name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-ci-compact.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      runner_json: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || (vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
      hygiene_enabled: true
      python_enabled: true
      python_versions_json: '["3.12","3.13","3.14"]'
      node_enabled: true
      node_versions_json: '["20","22","24"]'
      postgres_enabled: false
      container_enabled: false
      custom_enabled: false
