name: Release Proof Dispatch

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: dispatch proof
    if: ${{ github.event.workflow_run.event == 'push' }}
    permissions:
      actions: write
      contents: read
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-release-proof-dispatch.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      manifest_path: .prodkit/release.json
      required_workflows_json: '["CI","Security"]'
      proof_workflow_file: trusted-release-proof.yml

  # The hosted observer remains available for installations that explicitly opt
  # into GitHub-hosted control-plane execution. The default path is serialized
  # in Trusted Release Proof so a single trusted runner cannot deadlock while a
  # polling bridge waits for proof on that same runner.
  promote:
    name: bridge proof to promotion
    needs: dispatch
    if: ${{ github.event.workflow_run.event == 'push' && vars.PRODKIT_GITHUB_HOSTED_CONTROL_PLANE == 'true' }}
    permissions:
      actions: write
      contents: read
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-release-proof-promotion-dispatch.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      required_workflows_json: '["CI","Security"]'
      proof_workflow_file: trusted-release-proof.yml
      promotion_workflow_file: release-promotion.yml
