name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      target_sha:
        description: Exact current main SHA with successful CI, Security, and Trusted Release Proof
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
        default: false
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  runner:
    name: runner
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-runner-policy.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      mode: ${{ inputs.runner }}
      fork_safe: false

  release:
    name: release
    needs: runner
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-release-pipeline.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ inputs.target_sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: ${{ needs.runner.outputs.runner_json }}
      proof_workflow: Trusted Release Proof
      python_enabled: true
      python_version: "3.12"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "11.21.0"
      environment: release
