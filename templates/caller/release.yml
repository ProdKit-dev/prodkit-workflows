name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      target_sha:
        description: Exact current main SHA with successful required workflow evidence
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
        default: false
      runner:
        description: Single runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - github-hosted
          - self-hosted

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: release
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-release.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ inputs.target_sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: ${{ ((inputs.runner == 'self-hosted') || ((inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted'))) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      python_enabled: true
      python_version: "3.12"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "11.21.0"
      environment: release
