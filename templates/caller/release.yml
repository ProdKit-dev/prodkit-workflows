name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  proof-gate:
    name: Verify release-candidate proof
    runs-on: ${{ fromJSON(vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.sha }}
      PROOF_WORKFLOW: Trusted Release Proof
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact current main and successful proof
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          sha = os.environ["TARGET_SHA"]
          if len(sha) != 40 or any(ch not in "0123456789abcdef" for ch in sha):
              raise SystemExit("target SHA must be an exact lowercase 40-character commit SHA")
          repo = os.environ["GITHUB_REPOSITORY"]
          workflow = os.environ["PROOF_WORKFLOW"]
          token = os.environ["GH_TOKEN"]
          params = urllib.parse.urlencode(
              {"head_sha": sha, "event": "workflow_dispatch", "status": "completed", "per_page": 100}
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?{params}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "prodkit-workflows-release-proof-gate",
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              runs = json.load(response).get("workflow_runs", [])
          matches = [
              run
              for run in runs
              if run.get("name") == workflow
              and run.get("head_sha") == sha
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit(
                  f"missing successful workflow_dispatch {workflow!r} proof for exact SHA {sha}"
              )
          print(f"release-candidate proof: {matches[0].get('html_url')}")
          PY

  release:
    name: release
    needs: proof-gate
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-release.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ github.sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: ${{ vars.PRODKIT_RUNNER_JSON != '' && vars.PRODKIT_RUNNER_JSON || '["self-hosted","Linux","X64"]' }}
      required_workflows_json: '["CI","Security"]'
      python_enabled: true
      python_version: "3.12"
      uv_version: "0.10.0"
      node_enabled: true
      node_version: "24"
      pnpm_version: "11.21.0"
      environment: release
