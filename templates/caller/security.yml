name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - github-hosted
          - self-hosted
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-security.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      # Automatic events follow vars.PRODKIT_RUNNER_MODE. Manual dispatch may override it.
      # Fork-originated pull requests are always forced onto GitHub-hosted runners.
      runner_json: ${{ ((((github.event_name == 'workflow_dispatch') && ((inputs.runner == 'self-hosted') || ((inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted')))) || ((github.event_name != 'workflow_dispatch') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted'))) && ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository))) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      secret_scan_enabled: true
      sbom_enabled: true
      python_enabled: true
      node_enabled: true
      container_enabled: false
      custom_enabled: false
