name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - auto
          - github-hosted
          - self-hosted
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-probe:
    name: Hosted runner availability
    if: >-
      (((github.event_name == 'workflow_dispatch') &&
        ((inputs.runner == 'auto') ||
         ((inputs.runner == 'policy') &&
          ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto'))))) ||
       ((github.event_name != 'workflow_dispatch') &&
        ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))) &&
      ((github.event_name != 'pull_request') ||
       (github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub-hosted runner availability
        run: echo "GitHub-hosted runner is available"

  security:
    name: security
    needs: runner-probe
    if: >-
      always() && !cancelled() &&
      (needs.runner-probe.result == 'success' ||
       needs.runner-probe.result == 'failure' ||
       needs.runner-probe.result == 'skipped')
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-security.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      # Explicit github-hosted/self-hosted overrides are strict. Policy defaults to
      # hosted-first automatic failover when PRODKIT_RUNNER_MODE is unset or auto.
      # Fork-originated pull requests never fall back to a persistent runner.
      runner_json: ${{ (((((github.event_name == 'workflow_dispatch') && ((inputs.runner == 'self-hosted') || ((inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted')))) || ((github.event_name != 'workflow_dispatch') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted'))) && ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository))) || (needs.runner-probe.result == 'failure')) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      secret_scan_enabled: true
      sbom_enabled: true
      python_enabled: true
      node_enabled: true
      container_enabled: false
      custom_enabled: false
