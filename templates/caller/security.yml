name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: runner
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-runner-policy.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'policy' }}
      fork_safe: true

  security:
    name: security
    needs: runner
    uses: WORKFLOWS_REPOSITORY/.github/workflows/reusable-security-compact.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA
    with:
      runner_json: ${{ needs.runner.outputs.runner_json }}
      secret_scan_enabled: true
      sbom_enabled: true
      python_enabled: true
      node_enabled: true
      container_enabled: false
      custom_enabled: false
