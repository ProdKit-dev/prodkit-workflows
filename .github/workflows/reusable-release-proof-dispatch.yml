name: Reusable Release Proof Dispatch

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact default-branch SHA whose permanent gates just changed state.
        required: true
        type: string
      runner_json:
        description: JSON value accepted by runs-on. The dispatcher should normally remain GitHub-hosted.
        required: false
        type: string
        default: '"ubuntu-latest"'
      main_branch:
        required: false
        type: string
        default: main
      manifest_path:
        required: false
        type: string
        default: .prodkit/release.json
      required_workflows_json:
        description: Exact permanent push-workflow names required before proof may be dispatched.
        required: false
        type: string
        default: '["CI","Security"]'
      proof_workflow_file:
        description: Dispatch-only Trusted Release Proof workflow filename.
        required: false
        type: string
        default: trusted-release-proof.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: release-proof-dispatch-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch automatic trusted proof
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      MAIN_BRANCH: ${{ inputs.main_branch }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      REQUIRED_WORKFLOWS_JSON: ${{ inputs.required_workflows_json }}
      PROOF_WORKFLOW_FILE: ${{ inputs.proof_workflow_file }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify release intent and dispatch proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import pathlib
          import re
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source_sha = os.environ["SOURCE_SHA"]
          main_branch = os.environ["MAIN_BRANCH"]
          manifest_path = os.environ["MANIFEST_PATH"]
          proof_file = os.environ["PROOF_WORKFLOW_FILE"]
          required = json.loads(os.environ["REQUIRED_WORKFLOWS_JSON"])
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-workflows-release-proof-dispatch",
          }
          semver = re.compile(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?"
          )

          class ApiError(RuntimeError):
              def __init__(self, status: int, body: str) -> None:
                  super().__init__(f"GitHub API {status}: {body}")
                  self.status = status
                  self.body = body

          def api(method: str, path: str, payload: dict[str, Any] | None = None) -> Any:
              raw = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  root + path,
                  data=raw,
                  method=method,
                  headers={**headers, **({"Content-Type": "application/json"} if raw else {})},
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      body = response.read()
                      return None if not body else json.loads(body)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  raise ApiError(exc.code, body) from exc

          def source_bytes(path: str) -> bytes:
              candidate = pathlib.PurePosixPath(path)
              if candidate.is_absolute() or ".." in candidate.parts or str(candidate) in {"", "."}:
                  raise SystemExit(f"unsafe repository path: {path!r}")
              quoted = urllib.parse.quote(str(candidate), safe="/")
              item = api("GET", f"/contents/{quoted}?ref={urllib.parse.quote(source_sha, safe='')}")
              if item.get("type") != "file" or item.get("encoding") != "base64":
                  raise SystemExit(f"source path is not a base64 file: {path}")
              return base64.b64decode(item["content"])

          def dotted(value: Any, selector: str) -> Any:
              current = value
              for part in selector.split("."):
                  if not isinstance(current, dict) or part not in current:
                      raise SystemExit(f"version selector {selector!r} is missing {part!r}")
                  current = current[part]
              return current

          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_sha must be an exact lowercase 40-character commit SHA")
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", main_branch) or ".." in main_branch:
              raise SystemExit("invalid main_branch")
          if not re.fullmatch(r"[A-Za-z0-9._-]+\.ya?ml", proof_file):
              raise SystemExit("proof_workflow_file must be a workflow filename")
          if not isinstance(required, list) or not required or not all(isinstance(x, str) and x for x in required):
              raise SystemExit("required_workflows_json must be a non-empty JSON string array")
          if len(set(required)) != len(required):
              raise SystemExit("required_workflows_json must not contain duplicate workflow names")

          main = str(
              api("GET", f"/git/ref/heads/{urllib.parse.quote(main_branch, safe='/')}")["object"]["sha"]
          )
          if main != source_sha:
              print(f"stale gate completion ignored: current {main_branch} is {main}, trigger was {source_sha}")
              raise SystemExit(0)

          manifest = json.loads(source_bytes(manifest_path))
          if not isinstance(manifest, dict) or manifest.get("schema_version") != 1:
              raise SystemExit("release manifest schema_version must be 1")
          version_block = manifest.get("version")
          sources = version_block.get("sources") if isinstance(version_block, dict) else None
          if not isinstance(sources, list) or not sources:
              raise SystemExit("release manifest requires version.sources")

          versions: list[str] = []
          for index, source in enumerate(sources):
              if not isinstance(source, dict):
                  raise SystemExit(f"version.sources[{index}] must be an object")
              typ = source.get("type")
              path = source.get("path")
              selector = source.get("selector")
              if typ not in {"text", "json", "toml"} or not isinstance(path, str) or not path:
                  raise SystemExit(f"invalid version source at index {index}")
              raw = source_bytes(path)
              if typ == "text":
                  value: Any = raw.decode().strip()
              elif typ == "json":
                  value = dotted(json.loads(raw), selector or "version")
              else:
                  value = dotted(tomllib.loads(raw.decode()), selector or "project.version")
              versions.append(str(value))

          if len(set(versions)) != 1 or not semver.fullmatch(versions[0]):
              raise SystemExit(f"release version sources disagree or are invalid: {versions}")
          version = versions[0]
          tag = f"v{version}"

          try:
              ref = api("GET", f"/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
          except ApiError as exc:
              if exc.status != 404:
                  raise
              ref = None
          if ref is not None:
              obj = ref["object"]
              seen: set[str] = set()
              while obj.get("type") == "tag":
                  sha = str(obj["sha"])
                  if sha in seen:
                      raise SystemExit("tag object cycle detected")
                  seen.add(sha)
                  obj = api("GET", f"/git/tags/{sha}")["object"]
              if obj.get("type") != "commit" or obj.get("sha") != source_sha:
                  raise SystemExit(f"canonical version {tag} already exists on another source")
              print(f"{tag} already exists on current main; no unpublished release intent")
              raise SystemExit(0)

          query = urllib.parse.urlencode({"head_sha": source_sha, "event": "push", "per_page": 100})
          runs = list(api("GET", f"/actions/runs?{query}").get("workflow_runs", []))
          deferred: list[str] = []
          failed: list[str] = []
          for name in required:
              matches = [
                  run
                  for run in runs
                  if run.get("name") == name
                  and run.get("head_sha") == source_sha
                  and run.get("event") == "push"
              ]
              successful = [
                  run
                  for run in matches
                  if run.get("status") == "completed" and run.get("conclusion") == "success"
              ]
              if successful:
                  selected = max(successful, key=lambda item: int(item["id"]))
                  print(f"{name}: {selected.get('html_url')}")
                  continue
              active = [
                  run
                  for run in matches
                  if run.get("status") in {"queued", "in_progress", "pending", "waiting", "requested"}
              ]
              if active or not matches:
                  deferred.append(name)
                  continue
              failed.append(name)

          if failed:
              raise SystemExit("exact-main release gates completed unsuccessfully: " + ", ".join(failed))
          if deferred:
              print("release proof dispatch deferred until exact-main gates complete: " + ", ".join(deferred))
              raise SystemExit(0)

          caller_path = f".github/workflows/{proof_file}"
          caller_text = source_bytes(caller_path).decode()
          if "workflow_dispatch:" not in caller_text or "workflow_run:" in caller_text:
              raise SystemExit("Trusted Release Proof caller must remain workflow_dispatch-only")
          expected_source_contract = "source_sha: $" + "{{ github.sha }}"
          if expected_source_contract not in caller_text:
              raise SystemExit("Trusted Release Proof caller must certify the dispatched github.sha")

          proof_query = urllib.parse.urlencode(
              {"head_sha": source_sha, "event": "workflow_dispatch", "per_page": 100}
          )
          proof_runs = list(api("GET", f"/actions/runs?{proof_query}").get("workflow_runs", []))
          exact_proofs = [
              run
              for run in proof_runs
              if run.get("path") == caller_path
              and run.get("head_sha") == source_sha
              and run.get("event") == "workflow_dispatch"
          ]
          successful_proofs = [
              run
              for run in exact_proofs
              if run.get("status") == "completed" and run.get("conclusion") == "success"
          ]
          if successful_proofs:
              selected = max(successful_proofs, key=lambda item: int(item["id"]))
              print(f"successful exact-source Trusted Release Proof already exists: {selected.get('html_url')}")
              raise SystemExit(0)
          active_proofs = [
              run
              for run in exact_proofs
              if run.get("status") in {"queued", "in_progress", "pending", "waiting", "requested"}
          ]
          if active_proofs:
              selected = max(active_proofs, key=lambda item: int(item["id"]))
              print(f"active exact-source Trusted Release Proof already exists: {selected.get('html_url')}")
              raise SystemExit(0)

          current = str(
              api("GET", f"/git/ref/heads/{urllib.parse.quote(main_branch, safe='/')}")["object"]["sha"]
          )
          if current != source_sha:
              print(f"main moved before proof dispatch: {current} != {source_sha}; no dispatch")
              raise SystemExit(0)

          api(
              "POST",
              f"/actions/workflows/{urllib.parse.quote(proof_file, safe='')}/dispatches",
              {"ref": main_branch},
          )
          print(f"dispatched {proof_file} automatically for unpublished {tag} at exact main {source_sha}")
          PY
