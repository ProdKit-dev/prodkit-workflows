name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      target_sha:
        description: Exact current main SHA with successful permanent CI and Security
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        type: boolean
        default: false
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - auto
          - github-hosted
          - self-hosted

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  runner-probe:
    name: Hosted runner availability
    if: >-
      (inputs.runner == 'auto') ||
      ((inputs.runner == 'policy') &&
       ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        name: Confirm GitHub-hosted runner availability
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  release:
    needs: runner-probe
    if: always() && !cancelled()
    uses: ./.github/workflows/reusable-release.yml
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ inputs.target_sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: >-
        ${{ (
          (inputs.runner == 'self-hosted') ||
          ((inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted')) ||
          (
            ((inputs.runner == 'auto') ||
             ((inputs.runner == 'policy') && ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))) &&
            (needs.runner-probe.outputs.available != 'true')
          )
        ) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      environment: release
