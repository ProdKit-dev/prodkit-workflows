name: Organization Audit

on:
  workflow_dispatch:
    inputs:
      organization:
        description: GitHub organization to audit
        required: true
        default: ProdKit-dev
        type: string
      required_sha:
        description: Exact prodkit-workflows SHA consumers must pin
        required: true
        type: string
      repository_prefix:
        description: Optional repository name prefix
        required: false
        default: prodkit-
        type: string
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - auto
          - github-hosted
          - self-hosted

permissions:
  contents: read

jobs:
  runner-probe:
    name: Hosted runner availability
    if: >-
      (inputs.runner == 'auto') ||
      ((inputs.runner == 'policy') &&
       ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        name: Confirm GitHub-hosted runner availability
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  audit:
    needs: runner-probe
    if: always() && !cancelled()
    uses: ./.github/workflows/reusable-org-audit.yml
    with:
      organization: ${{ inputs.organization }}
      workflows_repository: ProdKit-dev/prodkit-workflows
      required_sha: ${{ inputs.required_sha }}
      repository_prefix: ${{ inputs.repository_prefix }}
      runner_json: >-
        ${{ (
          (inputs.runner == 'self-hosted') ||
          ((inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted')) ||
          (
            ((inputs.runner == 'auto') ||
             ((inputs.runner == 'policy') && ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))) &&
            (needs.runner-probe.outputs.available != 'true')
          )
        ) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
    secrets:
      org_audit_token: ${{ secrets.ORG_AUDIT_TOKEN }}
