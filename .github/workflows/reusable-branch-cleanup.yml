name: Reusable Branch Cleanup

on:
  workflow_call:
    inputs:
      branches_json:
        description: JSON array of explicit branch names eligible for cleanup
        required: true
        type: string
      expected_default_sha:
        description: Exact default-branch SHA the operator reviewed before cleanup
        required: true
        type: string
      runner_json:
        description: Complete JSON value accepted by runs-on
        required: false
        default: '"ubuntu-latest"'
        type: string
      dry_run:
        description: Validate and report without deleting refs
        required: false
        default: true
        type: boolean
    outputs:
      evidence_json:
        description: Compact cleanup evidence JSON
        value: ${{ jobs.cleanup.outputs.evidence_json }}

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Branch Cleanup Required
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 10
    concurrency:
      group: branch-cleanup-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      evidence_json: ${{ steps.cleanup.outputs.evidence_json }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCHES_JSON: ${{ inputs.branches_json }}
      EXPECTED_DEFAULT_SHA: ${{ inputs.expected_default_sha }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Validate and clean explicit branches
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_default_sha = os.environ["EXPECTED_DEFAULT_SHA"]
          dry_run = os.environ["DRY_RUN"].lower() == "true"
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          root = f"{api}/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-reusable-branch-cleanup",
          }

          def call(method: str, path: str, payload=None, *, allow_404: bool = False):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(root + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  if allow_404 and exc.code == 404:
                      return 404, None
                  raise SystemExit(f"GitHub API {method} {path} failed: HTTP {exc.code}: {detail[:500]}") from exc

          def ref_path(branch: str) -> str:
              return "/git/refs/" + urllib.parse.quote(f"heads/{branch}", safe="/")

          def branch_path(branch: str) -> str:
              return "/branches/" + urllib.parse.quote(branch, safe="")

          def validate_branch_name(branch: str) -> None:
              if not branch or len(branch) > 255:
                  raise ValueError("branch name must contain 1..255 characters")
              if branch.startswith("refs/"):
                  raise ValueError("use a branch name, not a refs/* path")
              if not re.fullmatch(r"[A-Za-z0-9._/-]+", branch):
                  raise ValueError("branch contains characters outside the cleanup contract")
              if branch.startswith(("/", ".")) or branch.endswith(("/", ".")):
                  raise ValueError("branch has a forbidden leading/trailing delimiter")
              if "//" in branch or ".." in branch or "@{" in branch or branch.endswith(".lock"):
                  raise ValueError("branch violates conservative Git ref safety rules")

          try:
              branches = json.loads(os.environ["BRANCHES_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit(f"branches_json must be valid JSON: {exc}") from exc
          if not isinstance(branches, list) or not branches:
              raise SystemExit("branches_json must be a non-empty JSON array")
          if len(branches) > 100:
              raise SystemExit("branches_json may contain at most 100 branches")
          if not all(isinstance(branch, str) for branch in branches):
              raise SystemExit("every cleanup target must be a string branch name")
          if len(set(branches)) != len(branches):
              raise SystemExit("branches_json contains duplicate branch names")
          for branch in branches:
              try:
                  validate_branch_name(branch)
              except ValueError as exc:
                  raise SystemExit(f"invalid cleanup target {branch!r}: {exc}") from exc

          if not re.fullmatch(r"[0-9a-f]{40}", expected_default_sha):
              raise SystemExit("expected_default_sha must be a full lowercase 40-character SHA")

          _, repository = call("GET", "")
          default_branch = repository["default_branch"]
          default_ref = ref_path(default_branch)
          _, default_obj = call("GET", default_ref)
          current_default_sha = default_obj["object"]["sha"]
          if current_default_sha != expected_default_sha:
              raise SystemExit(
                  f"default branch moved: expected {expected_default_sha}, current {current_default_sha}"
              )

          open_heads = set()
          page = 1
          while True:
              _, pulls = call("GET", f"/pulls?state=open&per_page=100&page={page}")
              for pull in pulls:
                  head = pull.get("head") or {}
                  head_repo = (head.get("repo") or {}).get("full_name")
                  if head_repo == repo and head.get("ref"):
                      open_heads.add(head["ref"])
              if len(pulls) < 100:
                  break
              page += 1

          evidence = {
              "repository": repo,
              "default_branch": default_branch,
              "expected_default_sha": expected_default_sha,
              "observed_default_sha": current_default_sha,
              "dry_run": dry_run,
              "requested": branches,
              "results": [],
          }
          present = []
          safety_failures = []

          for branch in branches:
              if branch == default_branch:
                  safety_failures.append((branch, "default branch is never deletable"))
                  continue
              status, info = call("GET", branch_path(branch), allow_404=True)
              if status == 404:
                  evidence["results"].append({"branch": branch, "state": "already_absent"})
                  continue
              if branch in open_heads:
                  safety_failures.append((branch, "branch is the head of an open pull request"))
                  continue
              if info.get("protected"):
                  safety_failures.append((branch, "branch is protected by repository policy"))
                  continue
              present.append(branch)
              evidence["results"].append(
                  {
                      "branch": branch,
                      "state": "would_delete" if dry_run else "validated",
                      "sha": (info.get("commit") or {}).get("sha"),
                  }
              )

          if safety_failures:
              for branch, reason in safety_failures:
                  evidence["results"].append({"branch": branch, "state": "rejected", "reason": reason})

          def write_evidence() -> None:
              compact = json.dumps(evidence, separators=(",", ":"), sort_keys=True)
              with open("cleanup-evidence.json", "w", encoding="utf-8") as handle:
                  json.dump(evidence, handle, indent=2, sort_keys=True)
                  handle.write("\n")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"evidence_json={compact}\n")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("## Branch cleanup evidence\n\n")
                      handle.write(f"- Repository: `{repo}`\n")
                      handle.write(f"- Default branch: `{default_branch}` @ `{current_default_sha}`\n")
                      handle.write(f"- Dry run: `{dry_run}`\n\n")
                      for item in evidence["results"]:
                          reason = f" — {item['reason']}" if item.get("reason") else ""
                          handle.write(f"- `{item['branch']}` — **{item['state']}**{reason}\n")
              print(json.dumps(evidence, indent=2, sort_keys=True))

          if safety_failures:
              write_evidence()
              raise SystemExit(
                  "cleanup preflight rejected targets: "
                  + ", ".join(f"{branch} ({reason})" for branch, reason in safety_failures)
              )

          if dry_run:
              write_evidence()
              raise SystemExit(0)

          _, default_obj = call("GET", default_ref)
          if default_obj["object"]["sha"] != expected_default_sha:
              write_evidence()
              raise SystemExit("default branch moved after cleanup preflight; refusing mutation")

          result_by_branch = {item["branch"]: item for item in evidence["results"]}
          for branch in present:
              _, default_obj = call("GET", default_ref)
              if default_obj["object"]["sha"] != expected_default_sha:
                  result_by_branch[branch]["state"] = "not_deleted_default_moved"
                  write_evidence()
                  raise SystemExit("default branch moved during cleanup; refusing further mutation")
              call("DELETE", ref_path(branch))
              status, _ = call("GET", ref_path(branch), allow_404=True)
              if status != 404:
                  result_by_branch[branch]["state"] = "verification_failed"
                  write_evidence()
                  raise SystemExit(f"branch deletion did not verify absent: {branch}")
              result_by_branch[branch]["state"] = "deleted"

          write_evidence()
          PY
