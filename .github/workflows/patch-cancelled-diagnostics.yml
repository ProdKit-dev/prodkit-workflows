name: Patch Compact Cancellation Diagnostics

on:
  push:
    branches: ["fix/compact-cancelled-diagnostics"]
    paths:
      - ".github/workflows/patch-cancelled-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: fix/compact-cancelled-diagnostics
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Patch workflows and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['TARGET_BRANCH']; token=os.environ['GH_TOKEN']
          api=os.environ.get('GITHUB_API_URL','https://api.github.com'); root=f'{api}/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'prodkit-cancel-diagnostic-patcher'}
          def call(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(root+path,data=body,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=120) as response:
                  raw=response.read(); return json.loads(raw) if raw else None
          def read(path):
              enc=urllib.parse.quote(path,safe='/'); item=call('GET',f'/contents/{enc}?ref={urllib.parse.quote(branch,safe="")}')
              return base64.b64decode(item['content']).decode(), item['sha']
          def write(path,text,sha,message):
              enc=urllib.parse.quote(path,safe='/')
              call('PUT',f'/contents/{enc}',{'message':message,'content':base64.b64encode(text.encode()).decode(),'sha':sha,'branch':branch})

          for path,label in [('.github/workflows/reusable-ci-compact.yml','CI'),('.github/workflows/reusable-security-compact.yml','Security')]:
              text,sha=read(path)
              old='      - name: Verify '+label+' contract\n        if: always()\n'
              new='      - name: Verify '+label+' contract\n        if: always() && !cancelled()\n'
              if old not in text:
                  raise SystemExit(f'missing expected aggregate verifier in {path}')
              text=text.replace(old,new,1)
              write(path,text,sha,'fix: preserve cancelled compact runs')

          path='scripts/test_contracts.py'; text,sha=read(path)
          old='            "continue-on-error: true",\n            "CI compact contract satisfied",'
          new='            "continue-on-error: true",\n            "if: always() && !cancelled()",\n            "CI compact contract satisfied",'
          if old not in text: raise SystemExit('missing compact CI regression anchor')
          text=text.replace(old,new,1)
          old='            "continue-on-error: true",\n            "Security compact contract satisfied",'
          new='            "continue-on-error: true",\n            "if: always() && !cancelled()",\n            "Security compact contract satisfied",'
          if old not in text: raise SystemExit('missing compact Security regression anchor')
          text=text.replace(old,new,1)
          write(path,text,sha,'test: require cancellation-safe aggregate verification')

          self_path='.github/workflows/patch-cancelled-diagnostics.yml'; _,self_sha=read(self_path)
          enc=urllib.parse.quote(self_path,safe='/')
          call('DELETE',f'/contents/{enc}',{'message':'chore: remove transient patch operator','sha':self_sha,'branch':branch})
          print('patched compact cancellation diagnostics and removed transient operator')
          PY

# retrigger after workflow registration
