name: Ops Release Environment Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ops-release-environment-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.event.pull_request.head.ref == 'fix/release-environments-without-deployments' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-environments-without-deployments
          fetch-depth: 0
          persist-credentials: true

      - name: Patch release environments and validate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN=717d171becc4438aa2574b332b37f5c52b1076cd
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

          python3 - <<'PY'
          from pathlib import Path

          expected_counts = {
              Path('.github/workflows/reusable-release.yml'): 1,
              Path('.github/workflows/reusable-release-metadata.yml'): 1,
              Path('.github/workflows/reusable-release-metadata-current.yml'): 2,
          }
          expression = '$' + '{{ inputs.environment }}'
          old = f'    environment: {expression}\n'
          new = f'    environment:\n      name: {expression}\n      deployment: false\n'
          for path, expected in expected_counts.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} environment declarations, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              if path.read_text(encoding='utf-8').count('deployment: false') < expected:
                  raise SystemExit(f'{path}: deployment:false marker missing')
          PY

          # Evaluate exactly the candidate tree, not the temporary operator tree.
          rm -- .github/workflows/ops-release-environment-fix.yml
          python3 scripts/test_contracts_current.py
          python3 scripts/test_release_metadata_compat.py
          python3 scripts/test_release_lifecycle.py
          git diff --check

          git add -- \
            .github/workflows/reusable-release.yml \
            .github/workflows/reusable-release-metadata.yml \
            .github/workflows/reusable-release-metadata-current.yml \
            .github/workflows/ops-release-environment-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): avoid deployment records for control-plane publication'
          git push origin HEAD:fix/release-environments-without-deployments
