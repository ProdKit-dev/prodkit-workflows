name: Hidden Asset Hardening Status

on:
  push:
    branches: [fix/release-hidden-asset-contract]
    paths: [hidden-asset-hardening-status-command.json]

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record operator status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch='fix/release-hidden-asset-contract'; token=os.environ['GH_TOKEN']
          H={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'prodkit-workflows-hardening-status'}
          def api(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,headers=H,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return None if not raw else json.loads(raw)
          q=urllib.parse.urlencode({'branch':branch,'event':'push','per_page':20})
          runs=api('GET',f'/repos/{repo}/actions/workflows/apply-hidden-asset-hardening.yml/runs?{q}').get('workflow_runs',[])
          runs.sort(key=lambda r:r.get('created_at',''),reverse=True)
          if runs:
              r=runs[0]; result={'state':'visible','id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'html_url':r.get('html_url')}
          else:
              result={'state':'missing'}
          path='hidden-asset-hardening-status-result.json'; ref=urllib.parse.quote(branch,safe='')
          try: cur=api('GET',f'/repos/{repo}/contents/{path}?ref={ref}')
          except Exception: cur=None
          payload={'message':'chore: record hardening operator status','content':base64.b64encode((json.dumps(result,indent=2)+'\n').encode()).decode(),'branch':branch}
          if cur: payload['sha']=cur['sha']
          api('PUT',f'/repos/{repo}/contents/{path}',payload)
          PY
