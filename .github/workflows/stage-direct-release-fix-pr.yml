name: Stage Direct Release Fix PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/direct-release-proof-and-pnpm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stage corrected release contracts
        shell: bash
        run: python3 <(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_HEAD_REF}/scripts/apply_direct_release_fix.py")
