name: Release Verification

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verification:
    name: verification
    if: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-release-verification.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml
