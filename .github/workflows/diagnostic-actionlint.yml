name: Diagnostic Actionlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pinned actionlint
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            -color
