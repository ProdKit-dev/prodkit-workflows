name: Trusted Release Proof

run-name: Trusted Release Proof — ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proof:
    name: proof
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-release-proof.yml
    with:
      source_sha: ${{ github.sha }}
      runner_json: '"ubuntu-latest"'
      proof_script: .prodkit/workflows/release-proof.sh
      required_workflows_json: '["CI","Security"]'
      manifest_path: .prodkit/release.json
      prepare_release_payload: true

  promote:
    name: promote proven release
    needs: proof
    if: ${{ vars.PRODKIT_GITHUB_HOSTED_CONTROL_PLANE != 'true' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/reusable-release-promote.yml
    with:
      source_sha: ${{ github.sha }}
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml
