name: Reusable Release

on:
  workflow_call:
    inputs:
      version:
        description: SemVer without the v prefix.
        required: true
        type: string
      target_sha:
        description: Exact current main commit to release.
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      runner_json:
        description: JSON value accepted by runs-on. Defaults to GitHub-hosted Ubuntu; callers may explicitly select trusted self-hosted labels.
        required: false
        type: string
        default: '"ubuntu-latest"'
      main_branch:
        required: false
        type: string
        default: main
      manifest_path:
        required: false
        type: string
        default: .prodkit/release.json
      required_workflows_json:
        description: Workflow names that must have successful push runs on target_sha.
        required: false
        type: string
        default: '["CI","Security"]'
      python_enabled:
        description: Provision uv and the requested baseline Python runtime before the release build contract.
        required: false
        type: boolean
        default: false
      python_version:
        required: false
        type: string
        default: "3.12"
      uv_version:
        required: false
        type: string
        default: "0.10.0"
      node_enabled:
        description: Provision Node.js and pnpm before the release build contract.
        required: false
        type: boolean
        default: false
      node_version:
        required: false
        type: string
        default: "24"
      pnpm_version:
        required: false
        type: string
        default: "11.21.0"
      syft_image:
        required: false
        type: string
        default: anchore/syft:v1.42.3
      generate_sbom:
        required: false
        type: boolean
        default: true
      attest:
        description: Generate GitHub Artifact Attestations. Enable only when the repository/organization plan supports attestations; when enabled, attestation failure is release-fatal.
        required: false
        type: boolean
        default: false
      environment:
        required: false
        type: string
        default: release

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Guarded release
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 90
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      TARGET_SHA: ${{ inputs.target_sha }}
      MAIN_BRANCH: ${{ inputs.main_branch }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      REQUIRED_WORKFLOWS_JSON: ${{ inputs.required_workflows_json }}
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Validate request shape
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_REF}" = "refs/heads/${MAIN_BRANCH}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}

      - name: Verify immutable source and permanent evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$MAIN_BRANCH" --tags --force
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse "origin/$MAIN_BRANCH")" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['TARGET_SHA']; token=os.environ['GH_TOKEN']
          required=json.loads(os.environ['REQUIRED_WORKFLOWS_JSON'])
          if not isinstance(required,list) or not required or not all(isinstance(x,str) and x for x in required):
              raise SystemExit('required_workflows_json must be a non-empty JSON string array')
          if len(set(required)) != len(required):
              raise SystemExit('required_workflows_json must not contain duplicate workflow names')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100",
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'prodkit-workflows-release'})
          with urllib.request.urlopen(req) as r: runs=json.load(r)['workflow_runs']
          missing=[]
          for name in required:
              matches=[x for x in runs if x.get('name')==name and x.get('event')=='push' and x.get('status')=='completed' and x.get('conclusion')=='success' and x.get('head_sha')==sha]
              if not matches: missing.append(name)
              else: print(f"{name}: {matches[0].get('html_url')}")
          if missing: raise SystemExit('missing successful exact-SHA push workflows: '+', '.join(missing))
          PY

      - name: Validate release manifest and metadata
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          root=pathlib.Path.cwd().resolve()
          raw_manifest=root/pathlib.Path(os.environ['MANIFEST_PATH'])
          if raw_manifest.is_absolute() and pathlib.Path(os.environ['MANIFEST_PATH']).is_absolute():
              raise SystemExit('manifest path must be repository-relative')
          if raw_manifest.is_symlink(): raise SystemExit('manifest must not be a symlink')
          mp=raw_manifest.resolve()
          if mp == root or root not in mp.parents: raise SystemExit('manifest escapes repository')
          if not mp.is_file(): raise SystemExit('release manifest missing')
          data=json.loads(mp.read_text())

          def require_obj(value,name):
              if not isinstance(value,dict): raise SystemExit(f'{name} must be an object')
              return value
          def reject_unknown(value,allowed,name):
              unknown=sorted(set(value)-set(allowed))
              if unknown: raise SystemExit(f'unknown {name} keys: {", ".join(unknown)}')
          def nonempty(value,name):
              if not isinstance(value,str) or not value: raise SystemExit(f'{name} must be a non-empty string')
              return value
          def inside(path, *, allow_root=False):
              raw=pathlib.Path(path)
              if raw.is_absolute(): raise SystemExit(f'absolute path is not allowed: {path}')
              p=(root/raw).resolve()
              if p == root and not allow_root: raise SystemExit(f'path resolves to repository root: {path}')
              if p != root and root not in p.parents: raise SystemExit(f'path escapes repository: {path}')
              return p
          def dotted(obj, selector):
              for part in selector.split('.'): obj=obj[part]
              return obj

          manifest=require_obj(data,'release manifest')
          reject_unknown(manifest,{'schema_version','version','notes','build','release'},'release manifest')
          missing={'schema_version','version','notes','build'}-set(manifest)
          if missing: raise SystemExit('missing release manifest keys: '+', '.join(sorted(missing)))
          if manifest['schema_version'] != 1: raise SystemExit('unsupported release manifest schema')

          version_block=require_obj(manifest['version'],'version')
          reject_unknown(version_block,{'sources'},'version')
          sources=version_block.get('sources')
          if not isinstance(sources,list) or not sources: raise SystemExit('at least one version source required')
          version=os.environ['RELEASE_VERSION']
          for index,src_value in enumerate(sources):
              src=require_obj(src_value,f'version.sources[{index}]')
              reject_unknown(src,{'type','path','selector'},f'version.sources[{index}]')
              missing_source={'type','path'}-set(src)
              if missing_source: raise SystemExit(f'version.sources[{index}] missing keys: '+', '.join(sorted(missing_source)))
              typ=src['type']; path=nonempty(src['path'],f'version.sources[{index}].path'); selector=src.get('selector')
              if typ not in {'text','json','toml'}: raise SystemExit(f'unsupported version source: {typ}')
              if selector is not None: nonempty(selector,f'version.sources[{index}].selector')
              p=inside(path)
              if not p.is_file(): raise SystemExit(f'version source missing: {path}')
              if typ=='text': actual=p.read_text().strip()
              elif typ=='json': actual=dotted(json.loads(p.read_text()), selector or 'version')
              else: actual=dotted(tomllib.loads(p.read_text()), selector or 'project.version')
              if str(actual) != version: raise SystemExit(f'version mismatch in {path}: {actual} != {version}')

          notes=require_obj(manifest['notes'],'notes')
          reject_unknown(notes,{'path_template','changelog_path','changelog_heading_template'},'notes')
          template=nonempty(notes.get('path_template'),'notes.path_template')
          changelog=notes.get('changelog_path','CHANGELOG.md'); nonempty(changelog,'notes.changelog_path')
          heading_template=notes.get('changelog_heading_template','## [{version}]'); nonempty(heading_template,'notes.changelog_heading_template')
          notes_path=template.format(version=version,tag='v'+version)
          p=inside(notes_path)
          if not p.is_file(): raise SystemExit(f'missing release notes: {notes_path}')
          cp=inside(changelog)
          if not cp.is_file(): raise SystemExit(f'missing changelog: {changelog}')
          heading=heading_template.format(version=version,tag='v'+version)
          if heading not in cp.read_text(): raise SystemExit(f'changelog missing heading: {heading}')

          build=require_obj(manifest['build'],'build')
          reject_unknown(build,{'script','artifact_dir','source_archive'},'build')
          script=nonempty(build.get('script'),'build.script'); artifact_dir=nonempty(build.get('artifact_dir'),'build.artifact_dir')
          source_archive=build.get('source_archive',True)
          if not isinstance(source_archive,bool): raise SystemExit('build.source_archive must be a boolean')
          raw_script=root/pathlib.Path(script)
          if raw_script.is_symlink(): raise SystemExit('release build script must not be a symlink')
          sp=inside(script); inside(artifact_dir)
          if not sp.is_file(): raise SystemExit('release build script missing')

          release=manifest.get('release',{})
          release=require_obj(release,'release')
          reject_unknown(release,{'name_template'},'release')
          name_template=release.get('name_template','{repository} {tag}'); nonempty(name_template,'release.name_template')
          repo=os.environ['GITHUB_REPOSITORY'].split('/',1)[-1]
          outputs={
              'notes_path':notes_path,'build_script':script,'artifact_dir':artifact_dir,
              'source_archive':'true' if source_archive else 'false',
              'release_name':name_template.format(repository=repo,version=version,tag='v'+version)
          }
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for k,v in outputs.items(): out.write(f'{k}={v}\n')
          PY

      - name: Preflight existing release
        id: preflight
        env:
          NOTES_PATH: ${{ steps.manifest.outputs.notes_path }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; tag=os.environ['RELEASE_TAG']; sha=os.environ['TARGET_SHA']; token=os.environ['GH_TOKEN']
          H={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'prodkit-workflows-release'}
          def get(url, accept=None):
              h=dict(H)
              if accept: h['Accept']=accept
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req) as r: return r.read(), r.status
              except urllib.error.HTTPError as e:
                  if e.code==404: return None,404
                  raise
          ref,st=get(f'https://api.github.com/repos/{repo}/git/ref/tags/{urllib.parse.quote(tag,safe="")}')
          if st==200 and json.loads(ref)['object']['sha'] != sha: raise SystemExit('immutable tag exists on another commit')
          body,st=get(f'https://api.github.com/repos/{repo}/releases/tags/{urllib.parse.quote(tag,safe="")}')
          published=False
          if st==200:
              rel=json.loads(body)
              if rel.get('draft'): raise SystemExit('unexpected draft returned by release-by-tag endpoint')
              assets={a['name']:a for a in rel.get('assets',[])}
              if 'SHA256SUMS' not in assets: raise SystemExit('published release lacks SHA256SUMS')
              sums_raw,_=get(assets['SHA256SUMS']['url'],'application/octet-stream')
              expected={}
              for line in sums_raw.decode().splitlines():
                  digest,name=line.split(None,1); expected[name.lstrip('*')]=digest
              expected_assets=set(expected)|{'SHA256SUMS'}
              if set(assets) != expected_assets:
                  raise SystemExit(f'published asset set mismatch: remote={sorted(assets)} expected={sorted(expected_assets)}')
              for name,digest in expected.items():
                  raw,_=get(assets[name]['url'],'application/octet-stream')
                  if hashlib.sha256(raw).hexdigest()!=digest: raise SystemExit(f'published checksum mismatch: {name}')
                  api_digest=assets[name].get('digest')
                  if api_digest and api_digest != f'sha256:{digest}': raise SystemExit(f'GitHub asset digest mismatch: {name}')
              published=True
              print(f'Existing published release {tag} verified; publication is idempotently complete.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'published={str(published).lower()}\n')
          PY

      - name: Prepare artifact directory
        if: steps.preflight.outputs.published != 'true'
        env:
          ARTIFACT_DIR: ${{ steps.manifest.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.preflight.outputs.published != 'true' && inputs.python_enabled
        with:
          version: ${{ inputs.uv_version }}
          enable-cache: true

      - name: Provision release Python runtime
        if: steps.preflight.outputs.published != 'true' && inputs.python_enabled
        shell: bash
        run: uv python install "${{ inputs.python_version }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.preflight.outputs.published != 'true' && inputs.node_enabled
        with:
          node-version: ${{ inputs.node_version }}

      - name: Provision release pnpm
        if: steps.preflight.outputs.published != 'true' && inputs.node_enabled
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${{ inputs.pnpm_version }}" --activate
          test "$(pnpm --version)" = "${{ inputs.pnpm_version }}"

      - name: Run release build contract
        if: steps.preflight.outputs.published != 'true'
        env:
          BUILD_SCRIPT: ${{ steps.manifest.outputs.build_script }}
          RELEASE_OUTPUT_DIR: ${{ steps.manifest.outputs.artifact_dir }}
          PRODKIT_RELEASE_PYTHON_VERSION: ${{ inputs.python_version }}
          PRODKIT_RELEASE_NODE_VERSION: ${{ inputs.node_version }}
          PRODKIT_RELEASE_PNPM_VERSION: ${{ inputs.pnpm_version }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$BUILD_SCRIPT"

      - name: Validate consumer release payload contract
        if: steps.preflight.outputs.published != 'true'
        env:
          ARTIFACT_DIR: ${{ steps.manifest.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          root=pathlib.Path.cwd().resolve(); d=pathlib.Path(os.environ['ARTIFACT_DIR']).resolve()
          if d == root or root not in d.parents: raise SystemExit('artifact dir escapes repository')
          if not d.is_dir(): raise SystemExit('release artifact directory missing')
          repo=os.environ['GITHUB_REPOSITORY'].split('/',1)[-1]
          reserved={
              'SHA256SUMS',
              'release-metadata.json',
              'repository.spdx.json',
              f"{repo}-{os.environ['RELEASE_TAG']}.tar.gz",
          }
          entries=list(d.iterdir())
          if not entries: raise SystemExit('consumer release payload set is empty')
          for p in entries:
              if p.name in reserved: raise SystemExit(f'consumer emitted central-owned artifact: {p.name}')
              if p.name.startswith('.'):
                  raise SystemExit(f'consumer release payload must not use hidden asset names: {p.name}')
              if p.is_symlink() or not p.is_file(): raise SystemExit(f'consumer release payload must be a flat regular file: {p.name}')
          print(f'consumer release payload contract satisfied: {len(entries)} file(s)')
          PY

      - name: Add exact source archive
        if: steps.preflight.outputs.published != 'true' && steps.manifest.outputs.source_archive == 'true'
        env:
          ARTIFACT_DIR: ${{ steps.manifest.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="${repo}-${RELEASE_TAG}/" -o "${ARTIFACT_DIR}/${repo}-${RELEASE_TAG}.tar.gz" "$TARGET_SHA"

      - name: Generate release SPDX SBOM
        if: steps.preflight.outputs.published != 'true' && inputs.generate_sbom
        env:
          ARTIFACT_DIR: ${{ steps.manifest.outputs.artifact_dir }}
          SYFT_IMAGE: ${{ inputs.syft_image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" "$SYFT_IMAGE" dir:/repo -o spdx-json > "$ARTIFACT_DIR/repository.spdx.json"
          test -s "$ARTIFACT_DIR/repository.spdx.json"

      - name: Seal artifact set
        if: steps.preflight.outputs.published != 'true'
        env:
          ARTIFACT_DIR: ${{ steps.manifest.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          d=pathlib.Path(os.environ['ARTIFACT_DIR']).resolve(); root=pathlib.Path.cwd().resolve()
          if d == root or root not in d.parents: raise SystemExit('artifact dir escapes repository')
          items=[]
          for p in sorted(d.iterdir()):
              if p.name in {'SHA256SUMS','release-metadata.json'}: continue
              if p.is_symlink() or not p.is_file(): raise SystemExit(f'only flat regular release files are allowed: {p.name}')
              items.append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          if not items: raise SystemExit('release artifact set is empty')
          meta={'schema_version':1,'repository':os.environ['GITHUB_REPOSITORY'],'version':os.environ['RELEASE_VERSION'],'tag':os.environ['RELEASE_TAG'],'source_sha':os.environ['TARGET_SHA'],'artifacts':items}
          (d/'release-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          files=[p for p in sorted(d.iterdir()) if p.is_file() and not p.is_symlink() and p.name!='SHA256SUMS']
          sums=''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files)
          (d/'SHA256SUMS').write_text(sums)
          PY
          (cd "$ARTIFACT_DIR" && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.preflight.outputs.published != 'true'
        with:
          name: release-${{ inputs.version }}-${{ inputs.target_sha }}
          path: ${{ steps.manifest.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 90

      - name: Attest release artifact checksums
        if: steps.preflight.outputs.published != 'true' && inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.manifest.outputs.artifact_dir }}/SHA256SUMS
          subject-version: ${{ inputs.version }}

      - name: Create immutable tag, draft release, upload, verify, publish
        if: steps.preflight.outputs.published != 'true'
        env:
          ARTIFACT_DIR: ${{ steps.manifest.outputs.artifact_dir }}
          NOTES_PATH: ${{ steps.manifest.outputs.notes_path }}
          RELEASE_NAME: ${{ steps.manifest.outputs.release_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, mimetypes, os, pathlib, urllib.error, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; tag=os.environ['RELEASE_TAG']; sha=os.environ['TARGET_SHA']; token=os.environ['GH_TOKEN']
          d=pathlib.Path(os.environ['ARTIFACT_DIR']); notes=pathlib.Path(os.environ['NOTES_PATH']).read_text(); prerelease=os.environ['PRERELEASE']=='true'
          H={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'prodkit-workflows-release'}
          def request(method,url,data=None,headers=None):
              h=dict(H); h.update(headers or {})
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req) as r: return r.read(),r.status
              except urllib.error.HTTPError as e:
                  if e.code==404: return None,404
                  print(e.read().decode(errors='replace'))
                  raise
          enc=urllib.parse.quote(tag,safe='')
          raw,st=request('GET',f'https://api.github.com/repos/{repo}/git/ref/tags/{enc}')
          if st==404:
              payload=json.dumps({'ref':f'refs/tags/{tag}','sha':sha}).encode()
              raw,_=request('POST',f'https://api.github.com/repos/{repo}/git/refs',payload,{'Content-Type':'application/json'})
              if json.loads(raw)['object']['sha'] != sha: raise SystemExit('created tag resolved incorrectly')
          elif json.loads(raw)['object']['sha'] != sha:
              raise SystemExit('refusing to move immutable tag')
          # The release-by-tag endpoint does not surface drafts. Enumerate releases
          # to recover a prior workflow-owned draft deterministically after a failed run.
          matches=[]
          page=1
          while True:
              raw,_=request('GET',f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}')
              batch=json.loads(raw)
              matches.extend(r for r in batch if r.get('tag_name')==tag)
              if len(batch)<100: break
              page+=1
          if len(matches)>1:
              raise SystemExit(f'multiple releases exist for {tag}; manual reconciliation required')
          if not matches:
              payload=json.dumps({'tag_name':tag,'target_commitish':sha,'name':os.environ['RELEASE_NAME'],'body':notes,'draft':True,'prerelease':prerelease}).encode()
              raw,_=request('POST',f'https://api.github.com/repos/{repo}/releases',payload,{'Content-Type':'application/json'})
              rel=json.loads(raw)
          else:
              rel=matches[0]
              if not rel.get('draft'): raise SystemExit('published release appeared during transaction; rerun for verification')
              # A draft is workflow-owned recovery state. Replace all draft assets deterministically.
              for a in rel.get('assets',[]): request('DELETE',a['url'])
              payload=json.dumps({'name':os.environ['RELEASE_NAME'],'body':notes,'draft':True,'prerelease':prerelease}).encode()
              raw,_=request('PATCH',f'https://api.github.com/repos/{repo}/releases/{rel["id"]}',payload,{'Content-Type':'application/json'})
              rel=json.loads(raw)
          release_id=rel['id']
          expected={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(d.iterdir()) if p.is_file() and not p.is_symlink()}
          for name in sorted(expected):
              p=d/name; q=urllib.parse.urlencode({'name':name})
              ctype=mimetypes.guess_type(name)[0] or 'application/octet-stream'
              request('POST',f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?{q}',p.read_bytes(),{'Content-Type':ctype})
          raw,_=request('GET',f'https://api.github.com/repos/{repo}/releases/{release_id}')
          rel=json.loads(raw); assets={a['name']:a for a in rel.get('assets',[])}
          if set(assets)!=set(expected): raise SystemExit(f'draft asset set mismatch: remote={sorted(assets)} expected={sorted(expected)}')
          for name,digest in expected.items():
              raw,_=request('GET',assets[name]['url'],headers={'Accept':'application/octet-stream'})
              if hashlib.sha256(raw).hexdigest()!=digest: raise SystemExit(f'draft asset checksum mismatch: {name}')
              api_digest=assets[name].get('digest')
              if api_digest and api_digest != f'sha256:{digest}': raise SystemExit(f'GitHub draft asset digest mismatch: {name}')
          payload=json.dumps({'draft':False,'prerelease':prerelease}).encode()
          raw,_=request('PATCH',f'https://api.github.com/repos/{repo}/releases/{release_id}',payload,{'Content-Type':'application/json'})
          rel=json.loads(raw)
          if rel.get('draft'): raise SystemExit('release remained draft')
          print(f"Published {rel['html_url']}")
          # Post-publication verification uses the published checksum file as the authority.
          raw,_=request('GET',f'https://api.github.com/repos/{repo}/releases/{release_id}')
          assets={a['name']:a for a in json.loads(raw).get('assets',[])}
          if 'SHA256SUMS' not in assets: raise SystemExit('published release lacks SHA256SUMS')
          sums_raw,_=request('GET',assets['SHA256SUMS']['url'],headers={'Accept':'application/octet-stream'})
          expected_sums={}
          for line in sums_raw.decode().splitlines():
              digest,name=line.split(None,1); expected_sums[name.lstrip('*')]=digest
          expected_assets=set(expected_sums)|{'SHA256SUMS'}
          if set(assets) != expected_assets:
              raise SystemExit(f'published asset set mismatch: remote={sorted(assets)} expected={sorted(expected_assets)}')
          for name,digest in expected_sums.items():
              raw,_=request('GET',assets[name]['url'],headers={'Accept':'application/octet-stream'})
              if hashlib.sha256(raw).hexdigest()!=digest: raise SystemExit(f'published asset checksum mismatch: {name}')
              api_digest=assets[name].get('digest')
              if api_digest and api_digest != f'sha256:{digest}': raise SystemExit(f'GitHub published asset digest mismatch: {name}')
          print(f'Verified {len(expected_sums)} published payload assets against SHA256SUMS')
          PY
