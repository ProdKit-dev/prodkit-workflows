name: Release Proof Dispatch

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: dispatch proof
    if: ${{ github.event.workflow_run.event == 'push' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/reusable-release-proof-dispatch.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      required_workflows_json: '["CI","Security"]'
      proof_workflow_file: trusted-release-proof.yml

  # The central public control-plane repository has GitHub-hosted capacity and
  # can keep its own observer hosted. Consumer templates separately default to
  # the serialized trusted-runner path for private repositories.
  promote:
    name: bridge proof to promotion
    needs: dispatch
    if: ${{ github.event.workflow_run.event == 'push' && vars.PRODKIT_GITHUB_HOSTED_CONTROL_PLANE == 'true' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/reusable-release-proof-promotion-dispatch.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      required_workflows_json: '["CI","Security"]'
      proof_workflow_file: trusted-release-proof.yml
      promotion_workflow_file: release-promotion.yml
