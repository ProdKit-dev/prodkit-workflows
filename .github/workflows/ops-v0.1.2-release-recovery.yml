name: Recover v0.1.2 Publication

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  verify-publication:
    name: independently verify publication
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/v0.1.2-release-recovery' }}
    permissions:
      actions: read
      contents: read
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-verification.yml@14088abf4f4a2f431f58b27c69d74f1b38d05252
    with:
      source_sha: 14088abf4f4a2f431f58b27c69d74f1b38d05252
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml

  cleanup:
    name: close recovery and dispatch cleanup
    needs: verify-publication
    if: ${{ needs.verify-publication.result == 'success' }}
    permissions:
      actions: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_SHA: 14088abf4f4a2f431f58b27c69d74f1b38d05252
      RECOVERY_PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Close recovery PR and dispatch SHA-bound cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source_sha = os.environ["SOURCE_SHA"]
          recovery_pr = int(os.environ["RECOVERY_PR"])
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-workflows-v0.1.2-recovery",
          }

          def api(method: str, path: str, payload: dict[str, Any] | None = None) -> Any:
              raw = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  root + path,
                  data=raw,
                  method=method,
                  headers={**headers, **({"Content-Type": "application/json"} if raw else {})},
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      body = response.read()
                      return None if not body else json.loads(body)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  raise RuntimeError(f"GitHub API {exc.code}: {body}") from exc

          main = str(api("GET", "/git/ref/heads/main")["object"]["sha"])
          if main != source_sha:
              raise SystemExit(f"main moved after verified publication: {main} != {source_sha}")

          query = urllib.parse.urlencode({"head_sha": source_sha, "event": "workflow_dispatch", "per_page": 100})
          runs = list(api("GET", f"/actions/runs?{query}").get("workflow_runs", []))
          proofs = [
              run for run in runs
              if run.get("path") == ".github/workflows/trusted-release-proof.yml"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          releases = [
              run for run in runs
              if run.get("path") == ".github/workflows/release.yml"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not proofs or not releases:
              raise SystemExit("exact-source proof/release evidence disappeared before cleanup")

          pr = api("GET", f"/pulls/{recovery_pr}")
          if pr.get("head", {}).get("ref") != "ops/v0.1.2-release-recovery" or pr.get("base", {}).get("ref") != "main":
              raise SystemExit("recovery PR identity changed")
          if pr.get("state") == "open":
              api("PATCH", f"/pulls/{recovery_pr}", {"state": "closed"})
              print(f"closed disposable recovery PR #{recovery_pr}")

          branches = [
              "release/v0.1.2-gated-cleanup",
              "fix/v0.1.2-gated-dispatch-inputs",
              "ops/v0.1.2-release-recovery",
          ]
          api(
              "POST",
              "/actions/workflows/branch-cleanup.yml/dispatches",
              {
                  "ref": "main",
                  "inputs": {
                      "branches_json": json.dumps(branches, separators=(",", ":")),
                      "dry_run": False,
                      "expected_default_sha": source_sha,
                  },
              },
          )
          print("verified publication; dispatched canonical Branch Cleanup")
          PY
