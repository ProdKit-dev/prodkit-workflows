name: Recover v0.1.2 Publication

on:
  push:
    branches: [ops/v0.1.2-release-recovery]

permissions:
  actions: write
  contents: read

jobs:
  recover:
    name: verify, publish, verify, cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 14088abf4f4a2f431f58b27c69d74f1b38d05252
      RELEASE_TAG: v0.1.2
      RELEASE_VERSION: 0.1.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recover only the proven exact-main release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source_sha = os.environ["SOURCE_SHA"]
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-workflows-v0.1.2-recovery",
          }

          class ApiError(RuntimeError):
              def __init__(self, status: int, body: str) -> None:
                  super().__init__(f"GitHub API {status}: {body}")
                  self.status = status
                  self.body = body

          def api(method: str, path: str, payload: dict[str, Any] | None = None) -> Any:
              raw = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  root + path,
                  data=raw,
                  method=method,
                  headers={**headers, **({"Content-Type": "application/json"} if raw else {})},
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      body = response.read()
                      return None if not body else json.loads(body)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  raise ApiError(exc.code, body) from exc

          def current_main() -> str:
              return str(api("GET", "/git/ref/heads/main")["object"]["sha"])

          def exact_runs() -> list[dict[str, Any]]:
              query = urllib.parse.urlencode({"head_sha": source_sha, "per_page": 100})
              return list(api("GET", f"/actions/runs?{query}").get("workflow_runs", []))

          if current_main() != source_sha:
              raise SystemExit(f"main moved: {current_main()} != {source_sha}")

          proofs = [
              run for run in exact_runs()
              if run.get("path") == ".github/workflows/trusted-release-proof.yml"
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("head_sha") == source_sha
          ]
          if not proofs:
              raise SystemExit("missing successful exact-SHA Trusted Release Proof")
          proof = max(proofs, key=lambda run: int(run["id"]))
          print(f"trusted proof: {proof.get('html_url')}")

          try:
              release = api("GET", f"/releases/tags/{urllib.parse.quote(tag, safe='')}")
          except ApiError as exc:
              if exc.status != 404:
                  raise
              release = None

          if release is None:
              runs = exact_runs()
              active = [
                  run for run in runs
                  if run.get("path") == ".github/workflows/release.yml"
                  and run.get("event") == "workflow_dispatch"
                  and run.get("head_sha") == source_sha
                  and run.get("status") in {"queued", "in_progress", "pending"}
              ]
              if active:
                  selected = max(active, key=lambda run: int(run["id"]))
                  print(f"active Release already exists: {selected.get('html_url')}")
              else:
                  api(
                      "POST",
                      "/actions/workflows/release.yml/dispatches",
                      {"ref": "main", "inputs": {"version": version, "prerelease": "false"}},
                  )
                  print(f"dispatched canonical Release for {tag} at {source_sha}")
          else:
              print(f"{tag} already published; continuing to immutable verification")

          release_ok = False
          verification_ok = False
          for _ in range(180):
              if current_main() != source_sha:
                  raise SystemExit("main moved while recovering release")
              runs = exact_runs()
              release_runs = [
                  run for run in runs
                  if run.get("path") == ".github/workflows/release.yml"
                  and run.get("event") == "workflow_dispatch"
                  and run.get("head_sha") == source_sha
              ]
              if release_runs:
                  latest = max(release_runs, key=lambda run: int(run["id"]))
                  if latest.get("status") == "completed" and latest.get("conclusion") != "success":
                      raise SystemExit(f"Release failed: {latest.get('html_url')} ({latest.get('conclusion')})")
                  release_ok = latest.get("status") == "completed" and latest.get("conclusion") == "success"

              try:
                  published = api("GET", f"/releases/tags/{urllib.parse.quote(tag, safe='')}")
                  ref = api("GET", f"/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
                  tag_ok = ref.get("object", {}).get("type") == "commit" and ref.get("object", {}).get("sha") == source_sha
                  release_ok = release_ok and not published.get("draft") and tag_ok
              except ApiError as exc:
                  if exc.status != 404:
                      raise
                  release_ok = False

              verification_runs = [
                  run for run in runs
                  if run.get("path") == ".github/workflows/release-verification.yml"
                  and run.get("event") == "workflow_run"
                  and run.get("head_sha") == source_sha
              ]
              if verification_runs:
                  latest_v = max(verification_runs, key=lambda run: int(run["id"]))
                  if latest_v.get("status") == "completed" and latest_v.get("conclusion") != "success":
                      raise SystemExit(
                          f"Release Verification failed: {latest_v.get('html_url')} ({latest_v.get('conclusion')})"
                      )
                  verification_ok = latest_v.get("status") == "completed" and latest_v.get("conclusion") == "success"

              if release_ok and verification_ok:
                  break
              time.sleep(10)
          else:
              raise SystemExit("timed out waiting for canonical Release and Release Verification")

          if current_main() != source_sha:
              raise SystemExit("main moved before cleanup authorization")

          branches = [
              "release/v0.1.2-gated-cleanup",
              "fix/v0.1.2-gated-dispatch-inputs",
              "ops/v0.1.2-release-recovery",
          ]
          api(
              "POST",
              "/actions/workflows/branch-cleanup.yml/dispatches",
              {
                  "ref": "main",
                  "inputs": {
                      "branches_json": json.dumps(branches, separators=(",", ":")),
                      "dry_run": False,
                      "expected_default_sha": source_sha,
                  },
              },
          )
          print("release verified; dispatched canonical Branch Cleanup for merged/recovery branches")
          PY
