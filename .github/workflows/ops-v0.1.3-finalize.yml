name: v0.1.3 Finalize

on:
  push:
    branches: [ops/v0.1.3-finalize]

permissions:
  contents: read

jobs:
  verify:
    name: independently verify v0.1.3 publication
    permissions:
      actions: read
      contents: read
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-verification.yml@89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc
    with:
      source_sha: 89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml

  dispatch-cleanup:
    name: dispatch canonical cleanup
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch exact-SHA branch cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/branch-cleanup.yml/dispatches"
          payload = {
              "ref": "main",
              "inputs": {
                  "branches_json": json.dumps([
                      "release/v0.1.3-verification-dispatch",
                      "ops/v0.1.3-finalize",
                  ]),
                  "expected_default_sha": "89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc",
                  "dry_run": "false",
              },
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "prodkit-workflows-v0.1.3-finalize",
              },
          )
          with urllib.request.urlopen(req) as response:
              if response.status != 204:
                  raise SystemExit(f"unexpected dispatch status: {response.status}")
          print("canonical cleanup dispatched")
          PY
