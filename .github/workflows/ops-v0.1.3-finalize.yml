name: v0.1.3 Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose exact-source release lifecycle
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enumerate exact-source workflow runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source = "89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc"
          query = urllib.parse.urlencode({"head_sha": source, "per_page": 100})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?{query}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "prodkit-workflows-v0.1.3-diagnose",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          rows = []
          for run in payload.get("workflow_runs", []):
              rows.append(
                  {
                      "id": run.get("id"),
                      "name": run.get("name"),
                      "path": run.get("path"),
                      "event": run.get("event"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "head_sha": run.get("head_sha"),
                  }
              )
          print(json.dumps(rows, indent=2, sort_keys=True))
          release_rows = [row for row in rows if row["path"] == ".github/workflows/release.yml"]
          if not release_rows:
              raise SystemExit("no exact-source Release workflow run found")
          PY
