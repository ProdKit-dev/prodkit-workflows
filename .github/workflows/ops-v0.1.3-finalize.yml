name: v0.1.3 Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: independently verify v0.1.3 publication
    permissions:
      actions: read
      contents: read
    uses: ProdKit-dev/prodkit-workflows/.github/workflows/reusable-release-verification.yml@89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc
    with:
      source_sha: 89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml

  close-and-dispatch-cleanup:
    name: close recovery and dispatch canonical cleanup
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Close recovery PR and dispatch exact-SHA cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          pr_number = os.environ["PR_NUMBER"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "prodkit-workflows-v0.1.3-finalize",
          }

          close_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls/{pr_number}",
              data=json.dumps({"state": "closed"}).encode(),
              method="PATCH",
              headers=headers,
          )
          with urllib.request.urlopen(close_req) as response:
              if response.status != 200:
                  raise SystemExit(f"unexpected PR close status: {response.status}")

          cleanup_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/branch-cleanup.yml/dispatches",
              data=json.dumps(
                  {
                      "ref": "main",
                      "inputs": {
                          "branches_json": json.dumps(
                              [
                                  "release/v0.1.3-verification-dispatch",
                                  "ops/v0.1.3-finalize",
                              ]
                          ),
                          "expected_default_sha": "89eec1f6bcd4e45fb67c9fa99122ea6feba9d4bc",
                          "dry_run": "false",
                      },
                  }
              ).encode(),
              method="POST",
              headers=headers,
          )
          with urllib.request.urlopen(cleanup_req) as response:
              if response.status != 204:
                  raise SystemExit(f"unexpected cleanup dispatch status: {response.status}")
          print("recovery PR closed; canonical cleanup dispatched")
          PY
