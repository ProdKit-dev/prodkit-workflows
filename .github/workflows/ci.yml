name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner target for manual failover
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_json: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      hygiene_enabled: true
      python_enabled: false
      node_enabled: false
      postgres_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/ci-custom.sh
