name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner target for manual failover
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_json: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      hygiene_enabled: true
      python_enabled: false
      node_enabled: false
      postgres_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/ci-custom.sh

  self-hosted-canary:
    name: self-hosted-canary
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_json: '["self-hosted","Linux","X64"]'
      hygiene_enabled: false
      python_enabled: false
      node_enabled: false
      postgres_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/ci-custom.sh
