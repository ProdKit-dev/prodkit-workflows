name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prodkit-control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/reusable-ci-compact.yml
    with:
      runner_json: '"ubuntu-latest"'
      hygiene_enabled: true
      python_enabled: false
      node_enabled: false
      postgres_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/ci-custom.sh

  apply-legacy-asset-fix:
    name: Apply legacy asset verification fix
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/legacy-hidden-release-asset-alias' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/legacy-hidden-release-asset-alias
          fetch-depth: 0
          persist-credentials: true
      - name: Patch, prove contracts, and remove temporary operator surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/reusable-release-metadata.yml')
          text = workflow.read_text()
          old = '''              expected_assets = set(expected) | {"SHA256SUMS"}\n              if set(assets) != expected_assets:\n                  raise SystemExit(\n                      f"published asset set mismatch: remote={sorted(assets)} "\n                      f"expected={sorted(expected_assets)}"\n                  )\n              for name, digest in sorted(expected.items()):\n                  payload_raw, payload_status = request(\n                      "GET",\n                      assets[name]["url"],\n                      accept="application/octet-stream",\n                  )\n                  if payload_status != 200 or hashlib.sha256(payload_raw).hexdigest() != digest:\n                      raise SystemExit(f"published checksum mismatch: {name}")\n                  api_digest = assets[name].get("digest")\n                  if api_digest and api_digest != f"sha256:{digest}":\n                      raise SystemExit(f"GitHub asset digest mismatch: {name}")\n'''
          new = '''              # GitHub historically transport-normalized a hidden `.gitignore`\n              # upload to `default.gitignore`. New releases reject hidden consumer\n              # asset names before publication; this alias exists only so metadata\n              # repair can verify already-published immutable releases byte-for-byte.\n              LEGACY_TRANSPORT_ALIASES = {".gitignore": "default.gitignore"}\n              resolved_assets = {}\n              consumed_remote_names = {"SHA256SUMS"}\n              for name in sorted(expected):\n                  remote_name = name\n                  if remote_name not in assets:\n                      alias = LEGACY_TRANSPORT_ALIASES.get(name)\n                      if alias is None or alias not in assets or alias in expected:\n                          expected_assets = set(expected) | {"SHA256SUMS"}\n                          raise SystemExit(\n                              f"published asset set mismatch: remote={sorted(assets)} "\n                              f"expected={sorted(expected_assets)}"\n                          )\n                      remote_name = alias\n                      print(\n                          f"legacy transport-normalized release asset: {name} -> {remote_name}"\n                      )\n                  resolved_assets[name] = assets[remote_name]\n                  consumed_remote_names.add(remote_name)\n\n              if set(assets) != consumed_remote_names:\n                  expected_assets = set(expected) | {"SHA256SUMS"}\n                  raise SystemExit(\n                      f"published asset set mismatch: remote={sorted(assets)} "\n                      f"expected={sorted(expected_assets)}"\n                  )\n              for name, digest in sorted(expected.items()):\n                  asset = resolved_assets[name]\n                  payload_raw, payload_status = request(\n                      "GET",\n                      asset["url"],\n                      accept="application/octet-stream",\n                  )\n                  if payload_status != 200 or hashlib.sha256(payload_raw).hexdigest() != digest:\n                      raise SystemExit(f"published checksum mismatch: {name}")\n                  api_digest = asset.get("digest")\n                  if api_digest and api_digest != f"sha256:{digest}":\n                      raise SystemExit(f"GitHub asset digest mismatch: {name}")\n'''
          if text.count(old) != 1:
              raise SystemExit('release metadata verification target drifted')
          workflow.write_text(text.replace(old, new))

          tests = Path('scripts/test_contracts.py')
          text = tests.read_text()
          anchor = '''    metadata = (ROOT / ".github/workflows/reusable-release-metadata-current.yml").read_text()\n'''
          addition = '''    metadata_repair = (ROOT / ".github/workflows/reusable-release-metadata.yml").read_text()\n    require(\n        metadata_repair,\n        (\n            'LEGACY_TRANSPORT_ALIASES = {".gitignore": "default.gitignore"}',\n            "resolved_assets = {}",\n            "legacy transport-normalized release asset",\n            "consumed_remote_names",\n        ),\n        name="Reusable Release Metadata Repair",\n    )\n    if "consumer release payload must not use hidden asset names" not in release:\n        raise SystemExit("legacy metadata compatibility must not weaken hidden-asset publication guard")\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('test insertion target drifted')
          tests.write_text(text.replace(anchor, addition + anchor))
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/legacy-hidden-asset-fix-operator.yml
          python3 scripts/test_contracts.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/reusable-release-metadata.yml scripts/test_contracts.py
          git add -u .github/workflows/legacy-hidden-asset-fix-operator.yml || true
          git commit -m 'fix(release): verify legacy normalized hidden assets'
          git push origin HEAD:fix/legacy-hidden-release-asset-alias
