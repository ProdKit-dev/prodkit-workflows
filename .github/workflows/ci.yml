name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options:
          - policy
          - auto
          - github-hosted
          - self-hosted

permissions:
  contents: read

concurrency:
  group: prodkit-control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-probe:
    name: Hosted runner availability
    if: >-
      (((github.event_name == 'workflow_dispatch') &&
        ((inputs.runner == 'auto') ||
         ((inputs.runner == 'policy') &&
          ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto'))))) ||
       ((github.event_name != 'workflow_dispatch') &&
        ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))) &&
      ((github.event_name != 'pull_request') ||
       (github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        name: Confirm GitHub-hosted runner availability
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: runner-probe
    if: always() && !cancelled()
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # Explicit github-hosted/self-hosted overrides are strict. Policy defaults to
      # hosted-first automatic failover when PRODKIT_RUNNER_MODE is unset or auto.
      # Fork-originated pull requests never fall back to a persistent runner.
      runner_json: ${{ (((((github.event_name == 'workflow_dispatch') && ((inputs.runner == 'self-hosted') || ((inputs.runner == 'policy') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted')))) || ((github.event_name != 'workflow_dispatch') && (vars.PRODKIT_RUNNER_MODE == 'self-hosted'))) || (((((github.event_name == 'workflow_dispatch') && ((inputs.runner == 'auto') || ((inputs.runner == 'policy') && ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto'))))) || ((github.event_name != 'workflow_dispatch') && ((vars.PRODKIT_RUNNER_MODE == '') || (vars.PRODKIT_RUNNER_MODE == 'auto')))) && (needs.runner-probe.outputs.available != 'true'))) && ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository))) && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"' }}
      hygiene_enabled: true
      python_enabled: false
      node_enabled: false
      postgres_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/ci-custom.sh
