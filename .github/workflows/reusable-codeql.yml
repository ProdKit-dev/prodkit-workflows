name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON value accepted by runs-on, normally from Reusable Runner Policy.
        required: true
        type: string
      languages_json:
        required: false
        type: string
        default: '["python","javascript-typescript","actions"]'
      check_script:
        description: Optional language-scoped SARIF policy adapter under .prodkit/workflows. It must inspect only PRODKIT_CODEQL_OUTPUT_DIR for the current PRODKIT_CODEQL_LANGUAGE and must not run repository-global hygiene or unrelated gates.
        required: false
        type: string
        default: ""
      retention_days:
        required: false
        type: number
        default: 14

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}

      - name: Analyze locally
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          upload: never
          upload-database: false
          output: .artifacts/codeql/${{ matrix.language }}

      - name: Validate CodeQL policy adapter
        if: inputs.check_script != ''
        shell: bash
        env:
          CHECK_SCRIPT: ${{ inputs.check_script }}
        run: |
          set -euo pipefail
          case "$CHECK_SCRIPT" in .prodkit/workflows/*.sh) ;; *) echo "invalid CodeQL check path: $CHECK_SCRIPT" >&2; exit 2 ;; esac
          root="$(realpath .prodkit/workflows)"
          resolved="$(realpath "$CHECK_SCRIPT")"
          [[ "$resolved" == "$root/"* ]] || { echo "CodeQL check path escapes .prodkit/workflows" >&2; exit 2; }
          test -f "$CHECK_SCRIPT" && test ! -L "$CHECK_SCRIPT"

      - name: Enforce language CodeQL policy
        if: inputs.check_script != ''
        shell: bash
        env:
          CHECK_SCRIPT: ${{ inputs.check_script }}
          PRODKIT_CODEQL_SCOPE: language-sarif-v1
          PRODKIT_CODEQL_LANGUAGE: ${{ matrix.language }}
          PRODKIT_CODEQL_OUTPUT_DIR: .artifacts/codeql/${{ matrix.language }}
        run: bash "$CHECK_SCRIPT"

      - name: Preserve SARIF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: .artifacts/codeql/${{ matrix.language }}/*.sarif
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  required:
    name: CodeQL Required
    if: always()
    needs: analyze
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 5
    steps:
      - name: Verify CodeQL matrix
        env:
          RESULT: ${{ needs.analyze.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "success" ]]; then
            echo "::error title=CodeQL Required::One or more language-scoped CodeQL analyses or SARIF policy checks failed. Open the failed language job; repository-global hygiene belongs in CI, not CodeQL."
            {
              echo "### CodeQL Required"
              echo
              echo "❌ One or more language-scoped CodeQL jobs failed."
              echo
              echo "Inspect only the failed language job(s); global repository hygiene is intentionally outside this matrix."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### CodeQL Required"
            echo
            echo "✅ All language-scoped CodeQL analyses and SARIF policy checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
