name: v0.1.4 Observe

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: observe exact-source release lifecycle
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: a0c292ee6a276a3f9b05470e58c4d5f3ed2130e7
    steps:
      - name: Enumerate exact-source workflow runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source = os.environ["SOURCE_SHA"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-workflows-v0.1.4-observe",
          }
          query = urllib.parse.urlencode({"head_sha": source, "per_page": 100})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?{query}", headers=headers
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              payload = json.load(response)
          rows = [
              {
                  "id": run.get("id"),
                  "name": run.get("name"),
                  "path": run.get("path"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
              }
              for run in payload.get("workflow_runs", [])
          ]
          print(json.dumps(rows, indent=2, sort_keys=True))
          if not any(row["path"] == ".github/workflows/ci.yml" for row in rows):
              raise SystemExit("exact-main CI run not visible yet")
          if not any(row["path"] == ".github/workflows/security.yml" for row in rows):
              raise SystemExit("exact-main Security run not visible yet")
          PY
