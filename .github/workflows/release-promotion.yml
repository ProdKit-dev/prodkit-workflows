name: Release Promotion

run-name: Release Promotion — ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}

on:
  workflow_run:
    workflows: ["Trusted Release Proof"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current-main SHA with a completed successful Trusted Release Proof
        required: true
        type: string
      proof_run_id:
        description: Exact successful Trusted Release Proof run ID recorded by the proof/promotion bridge
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  promote:
    name: promote
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/reusable-release-promote.yml
    with:
      source_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
      runner_json: '"ubuntu-latest"'
      manifest_path: .prodkit/release.json
      release_workflow_file: release.yml
