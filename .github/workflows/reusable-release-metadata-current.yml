name: Reusable Current Release Metadata

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON value accepted by runs-on, normally from Reusable Runner Policy.
        required: true
        type: string
      version:
        description: Optional explicit published SemVer without v prefix.
        required: false
        type: string
        default: ""
      source_sha:
        description: Optional explicit immutable tagged source SHA.
        required: false
        type: string
        default: ""
      manifest_path:
        required: false
        type: string
        default: .prodkit/release.json
      main_branch:
        required: false
        type: string
        default: main
      environment:
        required: false
        type: string
        default: release
      normalize_all_titles:
        description: Backward-compatible option to normalize every published SemVer Release name.
        required: false
        type: boolean
        default: false
      normalize_all_releases:
        description: Normalize every published SemVer Release name and canonical notes body from the release manifest.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: current-release-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select published release
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.select.outputs.version }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      exists: ${{ steps.select.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.main_branch }}

      - id: select
        name: Resolve immutable release source
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          MAIN_BRANCH: ${{ inputs.main_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$MAIN_BRANCH" --tags --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$MAIN_BRANCH")"
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, tomllib
          root = pathlib.Path.cwd().resolve()
          requested_version = os.environ["REQUESTED_VERSION"]
          requested_sha = os.environ["REQUESTED_SOURCE_SHA"]
          semver = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$")

          def inside(value: str) -> pathlib.Path:
              raw = pathlib.Path(value)
              if raw.is_absolute():
                  raise SystemExit(f"absolute path is not allowed: {value}")
              path = (root / raw).resolve()
              if path == root or root not in path.parents:
                  raise SystemExit(f"path escapes repository: {value}")
              return path

          if bool(requested_version) != bool(requested_sha):
              raise SystemExit("version and source_sha must be supplied together")

          if requested_version:
              if not semver.fullmatch(requested_version):
                  raise SystemExit("invalid requested version")
              if not re.fullmatch(r"[0-9a-f]{40}", requested_sha):
                  raise SystemExit("invalid requested source SHA")
              version = requested_version
              source_sha = requested_sha
          else:
              manifest = json.loads(inside(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8"))
              sources = manifest.get("version", {}).get("sources", [])
              if not sources:
                  raise SystemExit("release manifest has no version sources")
              src = sources[0]
              path = inside(src["path"])
              typ = src["type"]
              selector = src.get("selector")
              if typ == "text":
                  version = path.read_text(encoding="utf-8").strip()
              elif typ == "json":
                  value = json.loads(path.read_text(encoding="utf-8"))
                  for part in (selector or "version").split("."):
                      value = value[part]
                  version = str(value)
              elif typ == "toml":
                  value = tomllib.loads(path.read_text(encoding="utf-8"))
                  for part in (selector or "project.version").split("."):
                      value = value[part]
                  version = str(value)
              else:
                  raise SystemExit(f"unsupported version source: {typ}")
              if not semver.fullmatch(version):
                  raise SystemExit(f"invalid workspace version: {version}")
              source_sha = ""

          tag = f"v{version}"
          result = subprocess.run(
              ["git", "rev-list", "-n", "1", tag],
              text=True,
              capture_output=True,
              check=False,
          )
          exists = result.returncode == 0 and bool(result.stdout.strip())
          resolved = result.stdout.strip() if exists else ""
          if requested_sha and resolved != requested_sha:
              raise SystemExit(f"immutable tag {tag} does not resolve to requested source SHA")
          if not requested_sha:
              source_sha = resolved

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"source_sha={source_sha}\n")
              out.write(f"exists={'true' if exists else 'false'}\n")
          print(f"selected {tag}: exists={exists}; source={source_sha or '-'}")
          PY

  repair:
    name: repair-metadata
    needs: select
    if: needs.select.outputs.exists == 'true'
    uses: ./.github/workflows/reusable-release-metadata.yml
    with:
      version: ${{ needs.select.outputs.version }}
      source_sha: ${{ needs.select.outputs.source_sha }}
      runner_json: ${{ inputs.runner_json }}
      manifest_path: ${{ inputs.manifest_path }}
      main_branch: ${{ inputs.main_branch }}
      environment: ${{ inputs.environment }}

  normalize-releases:
    name: Normalize published release presentation
    needs: repair
    if: (inputs.normalize_all_titles || inputs.normalize_all_releases) && needs.repair.result == 'success'
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      NORMALIZE_NOTES: ${{ inputs.normalize_all_releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.main_branch }}

      - name: Normalize SemVer Release names and canonical notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ inputs.main_branch }}" --tags --force
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = pathlib.Path.cwd().resolve()
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          normalize_notes = os.environ["NORMALIZE_NOTES"].lower() == "true"

          def inside(value: str) -> pathlib.Path:
              raw = pathlib.Path(value)
              if raw.is_absolute():
                  raise SystemExit(f"absolute path is not allowed: {value}")
              path = (root / raw).resolve()
              if path == root or root not in path.parents:
                  raise SystemExit(f"path escapes repository: {value}")
              return path

          manifest = json.loads(inside(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8"))
          name_template = manifest.get("release", {}).get("name_template", "{repository} {tag}")
          notes_template = manifest.get("notes", {}).get("path_template")
          if not isinstance(notes_template, str) or not notes_template:
              raise SystemExit("release manifest notes.path_template is required")

          semver = re.compile(
              r"^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$"
          )
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-workflows-release-presentation-normalizer",
          }
          api = f"https://api.github.com/repos/{repo}"

          def request(method: str, url: str, payload=None):
              data = None
              h = dict(headers)
              if payload is not None:
                  data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))

          releases = []
          page = 1
          while True:
              batch = request("GET", f"{api}/releases?per_page=100&page={page}")
              if not isinstance(batch, list):
                  raise SystemExit("cannot enumerate GitHub Releases")
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          checked = 0
          changed = 0
          for release in releases:
              if release.get("draft") is not False:
                  continue
              tag = release.get("tag_name")
              if not isinstance(tag, str) or not semver.fullmatch(tag):
                  raise SystemExit(f"published Release has non-canonical tag: {tag!r}")

              version = tag[1:]
              expected_name = name_template.format(
                  repository=repo.split("/", 1)[-1],
                  version=version,
                  tag=tag,
              )
              notes_path = inside(notes_template.format(version=version, tag=tag))
              if not notes_path.is_file():
                  raise SystemExit(f"canonical release notes missing for {tag}: {notes_path.relative_to(root)}")
              expected_body = notes_path.read_text(encoding="utf-8")
              if not expected_body.strip():
                  raise SystemExit(f"canonical release notes are empty for {tag}")

              encoded_tag = urllib.parse.quote(tag, safe="")
              before_ref = request("GET", f"{api}/git/ref/tags/{encoded_tag}")
              ref_object = before_ref.get("object", {})
              before_ref_identity = (ref_object.get("type"), ref_object.get("sha"))
              if not all(before_ref_identity):
                  raise SystemExit(f"cannot resolve immutable tag ref {tag}")

              before = {
                  "tag_name": release.get("tag_name"),
                  "draft": release.get("draft"),
                  "prerelease": release.get("prerelease"),
                  "target_commitish": release.get("target_commitish"),
                  "assets": sorted(
                      (a.get("id"), a.get("name"), a.get("size"), a.get("digest"))
                      for a in release.get("assets", [])
                  ),
              }

              payload = {}
              if release.get("name") != expected_name:
                  payload["name"] = expected_name
              if normalize_notes and release.get("body") != expected_body:
                  payload["body"] = expected_body

              if payload:
                  updated = request("PATCH", f"{api}/releases/{release['id']}", payload)
                  changed += 1
              else:
                  updated = request("GET", f"{api}/releases/{release['id']}")

              after = {
                  "tag_name": updated.get("tag_name"),
                  "draft": updated.get("draft"),
                  "prerelease": updated.get("prerelease"),
                  "target_commitish": updated.get("target_commitish"),
                  "assets": sorted(
                      (a.get("id"), a.get("name"), a.get("size"), a.get("digest"))
                      for a in updated.get("assets", [])
                  ),
              }
              if after != before:
                  raise SystemExit(f"immutable/non-presentation Release metadata changed for {tag}")
              if updated.get("name") != expected_name:
                  raise SystemExit(f"Release title normalization failed for {tag}")
              if normalize_notes and updated.get("body") != expected_body:
                  raise SystemExit(f"Release notes normalization failed for {tag}")

              after_ref = request("GET", f"{api}/git/ref/tags/{encoded_tag}")
              after_ref_object = after_ref.get("object", {})
              after_ref_identity = (after_ref_object.get("type"), after_ref_object.get("sha"))
              if after_ref_identity != before_ref_identity:
                  raise SystemExit(f"immutable tag ref changed during presentation repair: {tag}")
              checked += 1

          print(
              f"release presentation canonical: checked={checked}; changed={changed}; "
              f"notes={'yes' if normalize_notes else 'no'}"
          )
          PY
