name: Diagnose v0.1.2 Proof

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/v0.1.2-release-recovery' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 14088abf4f4a2f431f58b27c69d74f1b38d05252
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report recent Trusted Release Proof runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; target=os.environ['SOURCE_SHA']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'prodkit-workflows-proof-diagnostic'}
          url=f'https://api.github.com/repos/{repo}/actions/workflows/trusted-release-proof.yml/runs?'+urllib.parse.urlencode({'event':'workflow_dispatch','per_page':20})
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120) as response:
              runs=json.load(response).get('workflow_runs',[])
          print('target', target)
          for run in runs:
              print(json.dumps({k:run.get(k) for k in ('id','head_sha','head_branch','status','conclusion','event','path','created_at','html_url')},sort_keys=True))
          exact=[r for r in runs if r.get('head_sha')==target and r.get('status')=='completed' and r.get('conclusion')=='success']
          if not exact:
              raise SystemExit('no successful exact-target proof in recent workflow_dispatch runs')
          PY
