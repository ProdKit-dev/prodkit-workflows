name: Diagnose v0.1.2 Proof

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/v0.1.2-release-recovery' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 14088abf4f4a2f431f58b27c69d74f1b38d05252
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report exact-source release chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; target=os.environ['SOURCE_SHA']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'prodkit-workflows-release-diagnostic'}
          params=urllib.parse.urlencode({'head_sha':target,'per_page':100})
          url=f'https://api.github.com/repos/{repo}/actions/runs?{params}'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120) as response:
              runs=json.load(response).get('workflow_runs',[])
          print('target', target)
          for run in sorted(runs,key=lambda r:int(r['id'])):
              print(json.dumps({k:run.get(k) for k in ('id','name','head_sha','head_branch','status','conclusion','event','path','created_at','updated_at','html_url')},sort_keys=True))
          exact_proof=[r for r in runs if r.get('path')=='.github/workflows/trusted-release-proof.yml' and r.get('event')=='workflow_dispatch' and r.get('status')=='completed' and r.get('conclusion')=='success']
          exact_release=[r for r in runs if r.get('path')=='.github/workflows/release.yml' and r.get('event')=='workflow_dispatch']
          exact_verification=[r for r in runs if r.get('path')=='.github/workflows/release-verification.yml' and r.get('event')=='workflow_run']
          print('proof_count',len(exact_proof),'release_count',len(exact_release),'verification_count',len(exact_verification))
          if not exact_proof:
              raise SystemExit('missing successful exact-target proof')
          if not exact_release:
              raise SystemExit('missing exact-target Release run')
          PY
