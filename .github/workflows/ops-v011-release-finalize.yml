name: Ops v0.1.1 Release Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-v011-release-finalize.yml"

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  cleanup-operator:
    name: close and clean disposable operator
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/v0.1.1-release-finalize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: 45e4dacd65c736588e0c7e2d3cdcb1cb0d11045e
      CURRENT_MAIN_SHA: 9105840ed105ed55830ff7015f1b5ae14657f5b5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release, close PR, and dispatch canonical cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          release_sha = os.environ["RELEASE_SHA"]
          current_main = os.environ["CURRENT_MAIN_SHA"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-workflows-v011-operator-cleanup",
          }

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repo}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          _, main = request("GET", "/branches/main")
          if main.get("commit", {}).get("sha") != current_main:
              raise SystemExit("main moved; refusing operator cleanup")

          _, tag = request("GET", "/git/ref/tags/v0.1.1")
          obj = tag.get("object", {})
          if obj.get("type") != "commit" or obj.get("sha") != release_sha:
              raise SystemExit("v0.1.1 tag identity changed")

          _, release = request("GET", "/releases/tags/v0.1.1")
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("v0.1.1 release is not final")
          expected = {
              "SHA256SUMS",
              "prodkit-workflows-contracts-v0.1.1.tar.gz",
              "prodkit-workflows-v0.1.1.tar.gz",
              "release-metadata.json",
              "repository.spdx.json",
          }
          actual = {asset.get("name") for asset in release.get("assets", [])}
          if actual != expected:
              raise SystemExit(f"v0.1.1 asset set drifted: {sorted(actual)}")

          status, _ = request("PATCH", "/pulls/35", {"state": "closed"})
          if status != 200:
              raise SystemExit(f"unexpected PR close status {status}")
          print("PR_35_CLOSED=true")

          status, _ = request(
              "POST",
              "/actions/workflows/branch-cleanup.yml/dispatches",
              {
                  "ref": "main",
                  "inputs": {
                      "branches_json": '["ops/v0.1.1-release-finalize"]',
                      "dry_run": "false",
                  },
              },
          )
          if status != 204:
              raise SystemExit(f"unexpected cleanup dispatch status {status}")
          print("CANONICAL_CLEANUP_DISPATCHED=true")
          PY
