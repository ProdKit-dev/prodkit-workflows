name: Ops v0.1.1 Release Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-v011-release-finalize.yml"

permissions:
  actions: read
  contents: read

jobs:
  observe-release:
    name: observe permanent v0.1.1 release chain
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/v0.1.1-release-finalize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 9105840ed105ed55830ff7015f1b5ae14657f5b5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Observe proof, promotion, release, verification, and publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prodkit-workflows-v011-observer",
          }

          def request(path: str):
              req = urllib.request.Request(f"{api}/repos/{repo}{path}", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          status, main = request("/branches/main")
          if status != 200 or main.get("commit", {}).get("sha") != target:
              raise SystemExit("main is no longer the reviewed v0.1.1 source")

          params = urllib.parse.urlencode({"head_sha": target, "per_page": 100})
          _, payload = request(f"/actions/runs?{params}")
          runs = payload.get("workflow_runs", [])

          def latest(path: str, event: str | None = None):
              matches = [run for run in runs if run.get("path") == path and run.get("head_sha") == target]
              if event is not None:
                  matches = [run for run in matches if run.get("event") == event]
              return max(matches, key=lambda item: int(item["id"])) if matches else None

          proof = latest(".github/workflows/trusted-release-proof.yml", "workflow_dispatch")
          promotion = latest(".github/workflows/release-promotion.yml", "workflow_run")
          release = latest(".github/workflows/release.yml", "workflow_dispatch")
          verification = latest(".github/workflows/release-verification.yml", "workflow_run")

          for label, run in (("PROOF", proof), ("PROMOTION", promotion), ("RELEASE", release), ("VERIFICATION", verification)):
              if run is None:
                  print(f"{label}=missing")
              else:
                  print(f"{label}_RUN_ID={run['id']}")
                  print(f"{label}_STATUS={run.get('status')}")
                  print(f"{label}_CONCLUSION={run.get('conclusion')}")

          tag_status, tag = request("/git/ref/tags/v0.1.1")
          if tag_status == 200:
              print(f"TAG_OBJECT_SHA={tag.get('object', {}).get('sha')}")
          else:
              print("TAG=missing")

          release_status, published = request("/releases/tags/v0.1.1")
          if release_status == 200:
              print(f"GITHUB_RELEASE_ID={published.get('id')}")
              print(f"GITHUB_RELEASE_DRAFT={published.get('draft')}")
              print(f"GITHUB_RELEASE_PRERELEASE={published.get('prerelease')}")
              assets = published.get("assets", [])
              print(f"GITHUB_RELEASE_ASSETS={len(assets)}")
              print("GITHUB_RELEASE_ASSET_NAMES=" + ",".join(sorted(asset.get("name", "") for asset in assets)))
          else:
              print("GITHUB_RELEASE=missing")
          PY
