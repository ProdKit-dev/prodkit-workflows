name: v0.1.4 Contract Alignment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/v0.1.4-proof-promotion-dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Align contracts and release documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              p = root / path
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, body: str) -> None:
              p = root / path
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  return
              p.write_text(text.rstrip() + "\n\n" + body.strip() + "\n", encoding="utf-8")

          # Keep the workflow inventory exact while this temporary alignment
          # operator exists; after the operator is deleted only the permanent
          # bridge remains in the expected inventory.
          replace_once(
              "scripts/test_contracts_current.py",
              "    test_contracts.main()\n",
              "    test_contracts.EXPECTED_GITHUB_WORKFLOWS.add(\"reusable-release-proof-promotion-dispatch.yml\")\n"
              "    temporary_alignment = ROOT / \".github/workflows/v014-contract-align.yml\"\n"
              "    if temporary_alignment.is_file():\n"
              "        test_contracts.EXPECTED_GITHUB_WORKFLOWS.add(temporary_alignment.name)\n"
              "    test_contracts.main()\n",
          )

          replace_once(
              "scripts/test_release_lifecycle.py",
              '    reusable_proof = text(".github/workflows/reusable-release-proof.yml")\n',
              '    reusable_proof = text(".github/workflows/reusable-release-proof.yml")\n'
              '    proof_promotion_bridge = text(".github/workflows/reusable-release-proof-promotion-dispatch.yml")\n',
          )
          replace_once(
              "scripts/test_release_lifecycle.py",
              "    # Promotion must start only after the proof workflow itself is complete.\n",
              "    # Automatic proof is dispatched with the repository GITHUB_TOKEN, so the\n"
              "    # generated lifecycle must not depend exclusively on a downstream workflow_run.\n"
              "    # A GitHub-hosted bounded bridge observes the exact proof and explicitly dispatches\n"
              "    # Release Promotion after successful completion.\n"
              "    for needle in (\n"
              "        \"actions: write\",\n"
              "        \"contents: read\",\n"
              "        \"release-proof-promotion-dispatch-${{ inputs.source_sha }}\",\n"
              "        \"proof_timeout_seconds:\",\n"
              "        \"poll_seconds:\",\n"
              "        \"timed out waiting for exact-source Trusted Release Proof\",\n"
              "        \"promotion_workflow_file\",\n"
              "        '\"proof_run_id\": str(selected_proof[\"id\"])',\n"
              "        \"time.sleep(poll_seconds)\",\n"
              "    ):\n"
              "        require(proof_promotion_bridge, needle, \"proof-to-promotion bridge\")\n"
              "    reject(proof_promotion_bridge, \"contents: write\", \"proof-to-promotion bridge\")\n\n"
              "    # Promotion must start only after the proof workflow itself is complete.\n",
          )
          replace_once(
              "scripts/test_release_lifecycle.py",
              "        \"actions: write\",\n    ):\n        require(promotion_template, needle, \"release promotion caller template\")\n",
              "        \"actions: write\",\n"
              "        \"workflow_dispatch:\",\n"
              "        \"source_sha:\",\n"
              "        \"proof_run_id:\",\n"
              "        \"github.event_name == 'workflow_dispatch'\",\n"
              "    ):\n"
              "        require(promotion_template, needle, \"release promotion caller template\")\n",
          )

          # Organization audit: consumers must pin both halves of the automatic
          # proof path and Release Promotion must accept the explicit handoff.
          replace_once(
              "scripts/audit_org.py",
              '                if workflow_events(text) != {"workflow_run"}:\n                    errors.append(\n                        "release-proof-dispatch.yml must expose workflow_run as its only trigger"\n                    )\n',
              '                bridge = (\n'
              '                    f"{args.workflows_repository}/.github/workflows/"\n'
              '                    f"reusable-release-proof-promotion-dispatch.yml@{args.required_sha}"\n'
              '                )\n'
              '                if bridge not in text or "promotion_workflow_file: release-promotion.yml" not in text:\n'
              '                    errors.append(\n'
              '                        "release-proof-dispatch.yml missing the exact pinned proof-to-promotion bridge"\n'
              '                    )\n'
              '                if workflow_events(text) != {"workflow_run"}:\n'
              '                    errors.append(\n'
              '                        "release-proof-dispatch.yml must expose workflow_run as its only trigger"\n'
              '                    )\n',
          )
          replace_once(
              "scripts/audit_org.py",
              '                for forbidden in ("time.sleep(", "while time.time()", "wait_for_release"):\n',
              '                for fragment in ("workflow_dispatch:", "source_sha:", "proof_run_id:", "github.event_name == \'workflow_dispatch\'"):\n'
              '                    if fragment not in text:\n'
              '                        errors.append(f"release-promotion.yml missing explicit proof bridge handoff: {fragment}")\n'
              '                if workflow_events(text) != {"workflow_run", "workflow_dispatch"}:\n'
              '                    errors.append(\n'
              '                        "release-promotion.yml must expose only workflow_run and workflow_dispatch"\n'
              '                    )\n'
              '                for forbidden in ("time.sleep(", "while time.time()", "wait_for_release"):\n',
          )

          # Lock the same permanent bridge into current-contract coverage.
          replace_once(
              "scripts/test_contracts_current.py",
              '    require(\n        ".github/workflows/release-proof-dispatch.yml",\n        "uses: ./.github/workflows/reusable-release-proof-dispatch.yml",\n        "control-plane automatic proof dispatch",\n    )\n',
              '    require(\n'
              '        ".github/workflows/release-proof-dispatch.yml",\n'
              '        "uses: ./.github/workflows/reusable-release-proof-dispatch.yml",\n'
              '        "control-plane automatic proof dispatch",\n'
              '    )\n'
              '    require(\n'
              '        ".github/workflows/release-proof-dispatch.yml",\n'
              '        "uses: ./.github/workflows/reusable-release-proof-promotion-dispatch.yml",\n'
              '        "control-plane proof-to-promotion bridge",\n'
              '    )\n'
              '    require(\n'
              '        "templates/caller/release-proof-dispatch.yml",\n'
              '        "reusable-release-proof-promotion-dispatch.yml@REPLACE_WITH_PRODKIT_WORKFLOWS_SHA",\n'
              '        "generated proof-to-promotion bridge pin",\n'
              '    )\n',
          )

          append_once(
              "docs/LIFECYCLE.md",
              "## GITHUB_TOKEN-safe proof-to-promotion bridge",
              """
          ## GITHUB_TOKEN-safe proof-to-promotion bridge

          v0.1.4 does not rely exclusively on `workflow_run` after an automatically dispatched `Trusted Release Proof`. GitHub suppresses some workflow-created follow-on events when the repository `GITHUB_TOKEN` initiated the child workflow, so a successful proof may complete without materializing a downstream `workflow_run` promotion event.

          `Release Proof Dispatch` therefore has two central phases. The first remains short and non-blocking: it validates exact-main CI/Security evidence and dispatches the dispatch-only `Trusted Release Proof`. The second delegates to `reusable-release-proof-promotion-dispatch.yml`, which runs only on `ubuntu-latest`, waits within a bounded timeout for the exact-source proof run, continuously rechecks current-main identity, fails closed on proof failure, and explicitly dispatches `Release Promotion` with the exact source SHA and proof run ID.

          `Release Promotion` retains its `workflow_run` entry for externally/manual dispatched proofs and also accepts the bridge's explicit `workflow_dispatch` handoff. The central publisher still independently requires a completed successful exact-source Trusted Release Proof before publication, so the bridge adds delivery reliability without weakening release authorization.

          The bounded wait is intentionally hosted and must never be moved onto the single trusted product runner. The trusted runner remains free for proof and publication work.
          """,
          )
          append_once(
              "docs/ADOPTION.md",
              "### Automatic proof promotion bridge",
              """
          ### Automatic proof promotion bridge

          v0.1.4 consumers install the complete generated `release-proof-dispatch.yml`. After exact-main CI/Security succeed, the caller dispatches `Trusted Release Proof` and a GitHub-hosted bounded bridge observes that exact proof to dispatch `Release Promotion`. Operators should not manually dispatch `Release` after proof success; the bridge exists specifically so automatic proof does not depend on a suppressed downstream `workflow_run` event.
          """,
          )
          append_once(
              "docs/CONTRACTS.md",
              "### Proof-to-promotion dispatch contract",
              """
          ### Proof-to-promotion dispatch contract

          Automatic release intent requires both `reusable-release-proof-dispatch.yml` and `reusable-release-proof-promotion-dispatch.yml` pinned to the same immutable central SHA. The proof dispatcher remains non-blocking. The promotion bridge is GitHub-hosted, bounded, exact-source-bound, fail-closed on proof failure or main movement, and may only dispatch the separate `Release Promotion` caller. It has `actions: write` and `contents: read`; it cannot publish or mutate repository content.
          """,
          )
          append_once(
              "README.md",
              "**v0.1.4 proof-to-promotion reliability:**",
              """
          **v0.1.4 proof-to-promotion reliability:** automatic proof dispatch is followed by a bounded GitHub-hosted exact-proof observer that explicitly dispatches `Release Promotion`. This avoids relying on a downstream `workflow_run` event that GitHub may suppress when the repository `GITHUB_TOKEN` dispatched the proof, while keeping `Trusted Release Proof` dispatch-only and publication independently proof-gated.
          """,
          )
          append_once(
              "docs/V0.1.4.md",
              "## Pre-publication lifecycle correction",
              """
          ## Pre-publication lifecycle correction

          Exact-source observation before tagging exposed a missing automatic edge: CI, Security, Release Proof Dispatch, and Trusted Release Proof succeeded, but no Release Promotion run materialized. The unreleased v0.1.4 candidate now uses a bounded GitHub-hosted proof-to-promotion bridge and explicit Promotion dispatch, preserving the dispatch-only proof boundary without a PAT or tag rewrite.
          """,
          )

          changelog = root / "CHANGELOG.md"
          text = changelog.read_text(encoding="utf-8")
          bullet = "- Bridge automatically dispatched proof to Release Promotion with an exact-source, bounded GitHub-hosted observer so v0.1.4 does not depend on a suppressed `workflow_run` edge.\n"
          if bullet not in text:
              anchor = "## [0.1.4] - 2026-08-23\n"
              if anchor not in text:
                  raise SystemExit("v0.1.4 changelog heading missing")
              text = text.replace(anchor, anchor + "\n" + bullet, 1)
              changelog.write_text(text, encoding="utf-8")
          PY

      - name: Commit aligned non-workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts docs README.md CHANGELOG.md; then
            echo "contracts already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts docs README.md CHANGELOG.md
          git commit -m "fix(release): align v0.1.4 bridge contracts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
