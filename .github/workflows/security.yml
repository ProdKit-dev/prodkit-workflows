name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: prodkit-control-plane-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    uses: ./.github/workflows/reusable-security-compact.yml
    with:
      runner_json: '"ubuntu-latest"'
      secret_scan_enabled: true
      sbom_enabled: true
      python_enabled: false
      node_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/security-custom.sh
