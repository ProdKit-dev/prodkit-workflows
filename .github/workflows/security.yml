name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  security:
    name: security
    uses: ./.github/workflows/reusable-security.yml
    with:
      runner_json: '["self-hosted","linux","x64"]'
      secret_scan_enabled: true
      sbom_enabled: true
      python_enabled: false
      node_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/security-custom.sh
