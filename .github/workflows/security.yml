name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner override; policy uses PRODKIT_RUNNER_MODE
        required: true
        type: choice
        default: policy
        options: [policy, auto, github-hosted, self-hosted]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: prodkit-control-plane-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: runner
    uses: ./.github/workflows/reusable-runner-policy.yml
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'policy' }}
      fork_safe: true

  security:
    name: security
    needs: runner
    uses: ./.github/workflows/reusable-security.yml
    with:
      runner_json: ${{ needs.runner.outputs.runner_json }}
      secret_scan_enabled: true
      sbom_enabled: true
      python_enabled: false
      node_enabled: false
      container_enabled: false
      custom_enabled: true
      custom_script: .prodkit/workflows/security-custom.sh
