name: Reusable Release Pipeline

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target_sha:
        description: Exact current main SHA to publish.
        required: true
        type: string
      runner_json:
        description: JSON value accepted by runs-on, normally from Reusable Runner Policy.
        required: true
        type: string
      proof_workflow:
        description: Human-readable proof workflow label retained for compatibility; authorization uses proof_workflow_file.
        required: false
        type: string
        default: Trusted Release Proof
      proof_workflow_file:
        description: Proof workflow file name or repository-relative workflow path.
        required: false
        type: string
        default: trusted-release-proof.yml
      required_push_workflows_json:
        description: Successful push workflows required on the exact target SHA before publication.
        required: false
        type: string
        default: '["CI","Security"]'
      prerelease:
        required: false
        type: boolean
        default: false
      python_enabled:
        required: false
        type: boolean
        default: false
      python_version:
        required: false
        type: string
        default: "3.12"
      uv_version:
        required: false
        type: string
        default: "0.10.0"
      node_enabled:
        required: false
        type: boolean
        default: false
      node_version:
        required: false
        type: string
        default: "24"
      pnpm_version:
        required: false
        type: string
        default: "11.21.0"
      generate_sbom:
        required: false
        type: boolean
        default: true
      attest:
        description: Generate GitHub Artifact Attestations. Enable only when supported by the repository/organization plan.
        required: false
        type: boolean
        default: false
      environment:
        required: false
        type: string
        default: release

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-pipeline-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    uses: ./.github/workflows/reusable-release.yml
    with:
      version: ${{ inputs.version }}
      target_sha: ${{ inputs.target_sha }}
      prerelease: ${{ inputs.prerelease }}
      runner_json: ${{ inputs.runner_json }}
      proof_workflow_file: ${{ inputs.proof_workflow_file }}
      required_workflows_json: ${{ inputs.required_push_workflows_json }}
      python_enabled: ${{ inputs.python_enabled }}
      python_version: ${{ inputs.python_version }}
      uv_version: ${{ inputs.uv_version }}
      node_enabled: ${{ inputs.node_enabled }}
      node_version: ${{ inputs.node_version }}
      pnpm_version: ${{ inputs.pnpm_version }}
      generate_sbom: ${{ inputs.generate_sbom }}
      attest: ${{ inputs.attest }}
      environment: ${{ inputs.environment }}
